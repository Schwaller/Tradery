// tradery-guide: Trading education guide with SVG diagrams
// Standalone module that can later become its own app.

plugins {
    id 'java-library'
    id 'application'
}

application {
    mainClass = 'com.tradery.guide.TradingGuideApp'
    mainModule = 'com.tradery.guide'
}

dependencies {
    implementation project(':tradery-help')
    implementation project(':tradery-ui-common')
    implementation 'com.formdev:flatlaf:3.4'
    implementation 'com.formdev:flatlaf-intellij-themes:3.4'
}
