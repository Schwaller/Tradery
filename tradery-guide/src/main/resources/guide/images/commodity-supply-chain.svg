    <text x="72" y="17" fill="#fab387" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Gulf States</text>
    <text x="72" y="29" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">Saudi, UAE, Iraq</text>
    <text x="72" y="40" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">30% global supply</text>

    <polygon points="131,23 139,20 139,26" fill="#fab387" fill-opacity="0.5"/>

    <rect x="148" y="0" width="108" height="46" fill="#fab387" fill-opacity="0.10" rx="5" stroke="#fab387" stroke-width="0.8" stroke-opacity="0.35"/>
    <text x="202" y="17" fill="#fab387" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Strait of Hormuz</text>
    <text x="202" y="29" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">20% global oil</text>
    <text x="202" y="40" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">Bab el-Mandeb</text>

