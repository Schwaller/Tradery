    <text x="202" y="29" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">Military tensions</text>
    <text x="202" y="40" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">Trade restrictions</text>

