    <text x="202" y="29" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">Nord Stream routes</text>
    <text x="202" y="40" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">Strait of Hormuz</text>

    <polygon points="261,23 269,20 269,26" fill="#f9e2af" fill-opacity="0.5"/>

    <rect x="278" y="0" width="130" height="46" fill="#f9e2af" fill-opacity="0.10" rx="5" stroke="#f9e2af" stroke-width="0.8" stroke-opacity="0.35"/>
    <text x="343" y="17" fill="#f9e2af" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">EU energy crisis</text>
    <text x="343" y="29" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">Gas prices 5-10x</text>
    <text x="343" y="40" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">Days to quarters</text>

    <polygon points="413,23 421,20 421,26" fill="#f9e2af" fill-opacity="0.5"/>

    <rect x="430" y="0" width="112" height="46" fill="#f38ba8" fill-opacity="0.10" rx="5" stroke="#f38ba8" stroke-width="0.8" stroke-opacity="0.35"/>
    <text x="486" y="17" fill="#f38ba8" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">EUR weakens</text>
    <text x="486" y="29" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">DXY strengthens</text>
    <text x="486" y="40" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">BTC headwind</text>
  </g>

  <!-- Bottom note -->
  <text x="280" y="310" fill="#7f849c" font-family="sans-serif" font-size="8" text-anchor="middle">Each row traces how a physical commodity disruption cascades into crypto-relevant financial impact</text>
</svg>