  <text x="350" y="50" fill="#7f849c" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Market</text>
  <text x="490" y="50" fill="#7f849c" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Financial Impact</text>

