    <text x="343" y="29" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">Tech sector shock</text>
    <text x="343" y="40" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">Days to months</text>

    <polygon points="413,23 421,20 421,26" fill="#cba6f7" fill-opacity="0.5"/>

    <rect x="430" y="0" width="112" height="46" fill="#f38ba8" fill-opacity="0.10" rx="5" stroke="#f38ba8" stroke-width="0.8" stroke-opacity="0.35"/>
    <text x="486" y="17" fill="#f38ba8" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">NASDAQ crash</text>
    <text x="486" y="29" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">Mining hardware hit</text>
    <text x="486" y="40" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">BTC -10% to -30%</text>
