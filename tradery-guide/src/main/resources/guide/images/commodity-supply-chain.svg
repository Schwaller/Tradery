    <rect x="278" y="0" width="130" height="46" fill="#fab387" fill-opacity="0.10" rx="5" stroke="#fab387" stroke-width="0.8" stroke-opacity="0.35"/>
    <text x="343" y="17" fill="#fab387" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Oil spikes $10-30/bbl</text>
    <text x="343" y="29" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">CPI rises 0.5-1.5%</text>
    <text x="343" y="40" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">Within hours-days</text>

