<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460">
  <rect width="560" height="460" fill="#000000" fill-opacity="0.3" rx="8"/>
  <text x="280" y="28" fill="#cdd6f4" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Ichimoku Cloud</text>

  <g transform="translate(50, 45)">
    <defs>
      <clipPath id="cloud-clip">
        <rect x="0" y="0" width="460" height="340"/>
      </clipPath>
    </defs>

    <!-- Axes -->
    <line x1="0" y1="0" x2="0" y2="340" stroke="#585b70" stroke-width="1"/>
    <line x1="0" y1="340" x2="460" y2="340" stroke="#585b70" stroke-width="1"/>

    <!-- ===== CLOUD ===== -->
    <!-- Bearish cloud (left): Senkou A below Senkou B (A_y > B_y) -->
    <polygon
      points="0,172 40,180 80,190 120,198 160,200 200,194 240,180 260,168
              260,155 240,162 200,170 160,168 120,160 80,155 40,150 0,148"
      fill="#f38ba8" opacity="0.14" clip-path="url(#cloud-clip)"/>

    <!-- Bullish cloud (right): Senkou A above Senkou B (A_y < B_y) -->
    <polygon
      points="280,148 320,130 360,118 400,110 440,106 460,104
              460,136 440,136 400,138 360,140 320,144 280,148"
      fill="#a6e3a1" opacity="0.14" clip-path="url(#cloud-clip)"/>

    <!-- Transition zone around twist (x=260-280) -->
    <polygon
      points="260,168 280,148 280,148 260,155"
      fill="#f9e2af" opacity="0.08" clip-path="url(#cloud-clip)"/>

    <!-- Senkou Span A (faster cloud line) -->
    <polyline
      points="0,172 40,180 80,190 120,198 160,200 200,194 240,180 260,168 280,148
              320,130 360,118 400,110 440,106 460,104"
      fill="none" stroke="#a6e3a1" stroke-width="1.5" stroke-linejoin="round" opacity="0.6"/>

    <!-- Senkou Span B (slower cloud line) -->
    <polyline
      points="0,148 40,150 80,155 120,160 160,168 200,170 240,162 260,155 280,148
              320,144 360,140 400,138 440,136 460,136"
      fill="none" stroke="#f38ba8" stroke-width="1.5" stroke-linejoin="round" opacity="0.6"/>

    <!-- ===== TENKAN & KIJUN ===== -->
    <!-- Tenkan (fast, 9-period) — starts below Kijun, crosses at x=160 -->
    <polyline
      points="0,278 40,270 80,260 120,248 140,238 160,225 180,210 200,196
              240,170 280,146 320,126 360,110 400,94 440,82 460,76"
      fill="none" stroke="#89b4fa" stroke-width="2" stroke-linejoin="round"/>

    <!-- Kijun (slow, 26-period) — crosses Tenkan at x=160 -->
    <polyline
      points="0,268 40,262 80,256 120,248 140,238 160,225 180,218 200,208
              240,188 280,168 320,150 360,134 400,120 440,110 460,106"
      fill="none" stroke="#fab387" stroke-width="2" stroke-dasharray="6,3" stroke-linejoin="round"/>

    <!-- ===== CHIKOU SPAN (price shifted ~26 bars left) ===== -->
    <polyline
      points="0,270 20,262 40,252 60,242 80,230 100,215 120,198
              140,178 160,155 180,138 200,124 230,108 260,96 290,86 320,78 350,70"
      fill="none" stroke="#cba6f7" stroke-width="1.5" stroke-dasharray="3,3" stroke-linejoin="round" opacity="0.45"/>

    <!-- ===== PRICE ===== -->
    <polyline
      points="0,288 30,280 60,270 90,262 120,256 150,246 180,234
              210,218 230,200 250,178 270,155 290,138 310,124
              340,108 370,96 400,86 430,78 460,70"
      fill="none" stroke="#cdd6f4" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- ===== ANNOTATIONS ===== -->

    <!-- 1. TK Cross at (160, 225) — where Tenkan and Kijun actually intersect -->
    <circle cx="160" cy="225" r="5" fill="#89dceb" fill-opacity="0.2" stroke="#89dceb" stroke-width="1.5"/>
    <line x1="160" y1="230" x2="160" y2="298" stroke="#89dceb" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
    <text x="160" y="310" fill="#89dceb" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">TK Cross</text>
    <text x="160" y="322" fill="#585b70" font-family="sans-serif" font-size="8" text-anchor="middle">Tenkan crosses above Kijun</text>

    <!-- 2. Cloud Breakout at ~(250, 178) — where price breaks above the cloud -->
    <circle cx="250" cy="178" r="5" fill="#cba6f7" fill-opacity="0.2" stroke="#cba6f7" stroke-width="1.5"/>
    <line x1="250" y1="172" x2="250" y2="58" stroke="#cba6f7" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
    <text x="250" y="52" fill="#cba6f7" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Cloud Breakout</text>
    <text x="250" y="64" fill="#585b70" font-family="sans-serif" font-size="8" text-anchor="middle">Price emerges above cloud</text>

    <!-- 3. Kumo Twist at (280, 148) — where Senkou A and B actually intersect -->
    <circle cx="280" cy="148" r="5" fill="#f9e2af" fill-opacity="0.2" stroke="#f9e2af" stroke-width="1.5"/>
    <line x1="280" y1="153" x2="280" y2="298" stroke="#f9e2af" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
    <text x="280" y="310" fill="#f9e2af" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Kumo Twist</text>
    <text x="280" y="322" fill="#585b70" font-family="sans-serif" font-size="8" text-anchor="middle">Cloud flips bullish</text>

    <!-- Zone labels -->
    <text x="80" y="138" fill="#f38ba8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" opacity="0.7">BEARISH</text>
    <text x="80" y="150" fill="#585b70" font-family="sans-serif" font-size="8" text-anchor="middle">Price below cloud</text>

    <text x="400" y="92" fill="#a6e3a1" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" opacity="0.7">BULLISH</text>
    <text x="400" y="104" fill="#585b70" font-family="sans-serif" font-size="8" text-anchor="middle">Price above cloud</text>

    <!-- ===== LEGEND ===== -->
    <g transform="translate(0, 370)">
      <line x1="0" y1="0" x2="20" y2="0" stroke="#cdd6f4" stroke-width="2.5"/>
      <text x="25" y="4" fill="#cdd6f4" font-family="sans-serif" font-size="9">Price</text>

      <line x1="75" y1="0" x2="95" y2="0" stroke="#89b4fa" stroke-width="2"/>
      <text x="100" y="4" fill="#89b4fa" font-family="sans-serif" font-size="9">Tenkan (9)</text>

      <line x1="178" y1="0" x2="198" y2="0" stroke="#fab387" stroke-width="2" stroke-dasharray="6,3"/>
      <text x="203" y="4" fill="#fab387" font-family="sans-serif" font-size="9">Kijun (26)</text>

      <line x1="278" y1="0" x2="298" y2="0" stroke="#cba6f7" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="303" y="4" fill="#cba6f7" font-family="sans-serif" font-size="9">Chikou</text>

      <rect x="360" y="-5" width="14" height="10" fill="#a6e3a1" opacity="0.25" rx="1"/>
      <rect x="374" y="-5" width="14" height="10" fill="#f38ba8" opacity="0.25" rx="1"/>
      <text x="393" y="4" fill="#7f849c" font-family="sans-serif" font-size="9">Cloud</text>
    </g>
  </g>
</svg>
