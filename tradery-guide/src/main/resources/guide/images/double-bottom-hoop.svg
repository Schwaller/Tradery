<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260">
  <rect width="560" height="260" fill="#000000" fill-opacity="0.3" rx="8"/>
  <text x="280" y="28" fill="#cdd6f4" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Double Bottom: Hoop Pattern Detection</text>

  <g transform="translate(40, 45)">
    <!-- Axes -->
    <line x1="0" y1="0" x2="0" y2="170" stroke="#585b70" stroke-width="1"/>
    <line x1="0" y1="170" x2="480" y2="170" stroke="#585b70" stroke-width="1"/>

    <!-- Neckline reference -->
    <line x1="0" y1="45" x2="480" y2="45" stroke="#585b70" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="485" y="49" fill="#585b70" font-family="sans-serif" font-size="8">neckline</text>

    <!-- Double bottom price path -->
    <polyline points="10,30 30,40 50,50 70,65 90,85 110,110 130,130 140,140 150,135 160,120 170,105 180,90 190,75 200,60 210,50 220,45 230,50 240,60 250,75 260,90 270,105 280,120 290,135 300,140 310,130 320,115 330,100 340,85 350,70 360,55 370,45 380,40 390,35 400,30 410,25 420,20 430,18"
      fill="none" stroke="#cdd6f4" stroke-width="2" stroke-linejoin="round"/>

    <!-- Hoop 1: First Low -->
    <rect x="120" y="120" width="40" height="30" fill="#89b4fa" fill-opacity="0.12" rx="3" stroke="#89b4fa" stroke-width="1" stroke-dasharray="4,3"/>
    <circle cx="140" cy="140" r="5" fill="#89b4fa"/>
    <text x="140" y="162" fill="#89b4fa" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">1st Low</text>

    <!-- Hoop 2: Middle Peak -->
    <rect x="200" y="35" width="40" height="25" fill="#a6e3a1" fill-opacity="0.12" rx="3" stroke="#a6e3a1" stroke-width="1" stroke-dasharray="4,3"/>
    <circle cx="220" cy="45" r="5" fill="#a6e3a1"/>
    <text x="220" y="28" fill="#a6e3a1" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Peak</text>

    <!-- Hoop 3: Second Low -->
    <rect x="280" y="118" width="40" height="35" fill="#fab387" fill-opacity="0.12" rx="3" stroke="#fab387" stroke-width="1" stroke-dasharray="4,3"/>
    <circle cx="300" cy="140" r="5" fill="#fab387"/>
    <text x="300" y="164" fill="#fab387" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">2nd Low</text>

    <!-- Hoop 4: Breakout -->
    <rect x="360" y="25" width="40" height="25" fill="#f38ba8" fill-opacity="0.12" rx="3" stroke="#f38ba8" stroke-width="1" stroke-dasharray="4,3"/>
    <circle cx="375" cy="40" r="5" fill="#f38ba8"/>
    <text x="380" y="18" fill="#f38ba8" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Breakout</text>

    <!-- Entry arrow -->
    <line x1="375" y1="50" x2="375" y2="65" stroke="#a6e3a1" stroke-width="2" marker-end="url(#entryArr)"/>
    <text x="375" y="78" fill="#a6e3a1" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">ENTRY</text>

    <!-- W shape annotation -->
    <text x="220" y="183" fill="#7f849c" font-family="sans-serif" font-size="10" text-anchor="middle">Classic "W" reversal pattern</text>
  </g>

  <defs>
    <marker id="entryArr" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#a6e3a1"/>
    </marker>
  </defs>
</svg>
