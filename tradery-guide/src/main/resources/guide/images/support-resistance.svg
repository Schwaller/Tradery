<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300">
  <rect width="560" height="300" fill="#000000" fill-opacity="0.3" rx="8"/>

  <text x="280" y="28" fill="#cdd6f4" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Support &amp; Resistance</text>

  <!-- Resistance line -->
  <line x1="60" y1="80" x2="500" y2="80" stroke="#f38ba8" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="510" y="84" fill="#f38ba8" font-family="sans-serif" font-size="12" font-weight="bold">Resistance</text>

  <!-- Support line -->
  <line x1="60" y1="220" x2="500" y2="220" stroke="#a6e3a1" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="510" y="224" fill="#a6e3a1" font-family="sans-serif" font-size="12" font-weight="bold">Support</text>

  <!-- Price action bouncing between levels -->
  <polyline
    points="70,200 100,150 120,210 150,100 170,85 190,130 220,210 250,150 270,215 300,120 320,90 340,85 360,110 380,200 410,140 430,215 460,160 490,100"
    fill="none" stroke="#89b4fa" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Bounce arrows at support -->
  <g fill="#a6e3a1">
    <polygon points="120,215 115,225 125,225"/>
    <polygon points="270,220 265,230 275,230"/>
    <polygon points="430,220 425,230 435,230"/>
  </g>

  <!-- Rejection arrows at resistance -->
  <g fill="#f38ba8">
    <polygon points="170,80 165,70 175,70"/>
    <polygon points="320,85 315,75 325,75"/>
    <polygon points="340,80 335,70 345,70"/>
  </g>

  <!-- Label -->
  <text x="280" y="275" fill="#585b70" font-family="sans-serif" font-size="11" text-anchor="middle">Price bounces between support (buyers) and resistance (sellers)</text>
</svg>
