<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200">
  <rect width="560" height="200" fill="#000000" fill-opacity="0.3" rx="8"/>
  <text x="280" y="28" fill="#cdd6f4" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Trading Sessions (UTC)</text>

  <g transform="translate(40, 50)">
    <!-- Timeline axis -->
    <line x1="0" y1="100" x2="480" y2="100" stroke="#585b70" stroke-width="1"/>

    <!-- Hour markers -->
    <line x1="0" y1="96" x2="0" y2="104" stroke="#585b70" stroke-width="1"/>
    <text x="0" y="118" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="middle">00</text>

    <line x1="80" y1="96" x2="80" y2="104" stroke="#585b70" stroke-width="1"/>
    <text x="80" y="118" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="middle">04</text>

    <line x1="160" y1="96" x2="160" y2="104" stroke="#585b70" stroke-width="1"/>
    <text x="160" y="118" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="middle">08</text>

    <line x1="240" y1="96" x2="240" y2="104" stroke="#585b70" stroke-width="1"/>
    <text x="240" y="118" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="middle">12</text>

    <line x1="320" y1="96" x2="320" y2="104" stroke="#585b70" stroke-width="1"/>
    <text x="320" y="118" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="middle">16</text>

    <line x1="400" y1="96" x2="400" y2="104" stroke="#585b70" stroke-width="1"/>
    <text x="400" y="118" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="middle">20</text>

    <line x1="480" y1="96" x2="480" y2="104" stroke="#585b70" stroke-width="1"/>
    <text x="480" y="118" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="middle">24</text>

    <!-- Asian session: 00:00-08:00 -->
    <rect x="0" y="10" width="160" height="24" fill="#89b4fa" fill-opacity="0.15" rx="4"/>
    <rect x="0" y="10" width="160" height="24" fill="none" stroke="#89b4fa" stroke-width="1" stroke-opacity="0.4" rx="4"/>
    <text x="80" y="26" fill="#89b4fa" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Asian</text>

    <!-- European session: 07:00-16:00 -->
    <rect x="140" y="38" width="180" height="24" fill="#a6e3a1" fill-opacity="0.15" rx="4"/>
    <rect x="140" y="38" width="180" height="24" fill="none" stroke="#a6e3a1" stroke-width="1" stroke-opacity="0.4" rx="4"/>
    <text x="230" y="54" fill="#a6e3a1" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">European</text>

    <!-- US session: 13:00-21:00 -->
    <rect x="260" y="66" width="160" height="24" fill="#fab387" fill-opacity="0.15" rx="4"/>
    <rect x="260" y="66" width="160" height="24" fill="none" stroke="#fab387" stroke-width="1" stroke-opacity="0.4" rx="4"/>
    <text x="340" y="82" fill="#fab387" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">US</text>

    <!-- Overlap highlight: 13:00-16:00 -->
    <rect x="260" y="38" width="60" height="52" fill="#f38ba8" fill-opacity="0.1" rx="3"/>
    <line x1="260" y1="38" x2="260" y2="90" stroke="#f38ba8" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="320" y1="38" x2="320" y2="90" stroke="#f38ba8" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Overlap label -->
    <text x="290" y="135" fill="#f38ba8" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Overlap</text>
    <text x="290" y="146" fill="#585b70" font-family="sans-serif" font-size="8" text-anchor="middle">Peak volume</text>
  </g>
</svg>
