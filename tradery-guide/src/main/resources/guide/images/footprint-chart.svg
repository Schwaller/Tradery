<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280">
  <rect width="560" height="280" fill="#000000" fill-opacity="0.3" rx="8"/>
  <text x="280" y="28" fill="#cdd6f4" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Footprint Chart Anatomy</text>

  <!-- Footprint grid -->
  <g transform="translate(60, 50)">
    <text x="85" y="0" fill="#cdd6f4" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Buy vs Sell at Each Price Level</text>

    <!-- Price labels -->
    <text x="-8" y="30" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="end">$105</text>
    <text x="-8" y="58" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="end">$104</text>
    <text x="-8" y="86" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="end">$103</text>
    <text x="-8" y="114" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="end">$102</text>
    <text x="-8" y="142" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="end">$101</text>
    <text x="-8" y="170" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="end">$100</text>

    <!-- Grid rows -->
    <rect x="0" y="16" width="170" height="26" fill="#313244" fill-opacity="0.3" rx="2"/>
    <rect x="0" y="44" width="170" height="26" fill="#313244" fill-opacity="0.5" rx="2"/>
    <rect x="0" y="72" width="170" height="26" fill="#a6e3a1" fill-opacity="0.08" rx="2"/>
    <rect x="0" y="100" width="170" height="26" fill="#a6e3a1" fill-opacity="0.12" rx="2"/>
    <rect x="0" y="128" width="170" height="26" fill="#a6e3a1" fill-opacity="0.08" rx="2"/>
    <rect x="0" y="156" width="170" height="26" fill="#313244" fill-opacity="0.3" rx="2"/>

    <!-- Column headers -->
    <text x="42" y="10" fill="#a6e3a1" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Buy</text>
    <text x="85" y="10" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="middle">x</text>
    <text x="128" y="10" fill="#f38ba8" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Sell</text>

    <!-- Row data: Buy x Sell -->
    <text x="42" y="33" fill="#a6e3a1" font-family="sans-serif" font-size="11" text-anchor="middle">12</text>
    <text x="85" y="33" fill="#585b70" font-family="sans-serif" font-size="11" text-anchor="middle">x</text>
    <text x="128" y="33" fill="#f38ba8" font-family="sans-serif" font-size="11" text-anchor="middle">45</text>

    <text x="42" y="61" fill="#a6e3a1" font-family="sans-serif" font-size="11" text-anchor="middle">28</text>
    <text x="85" y="61" fill="#585b70" font-family="sans-serif" font-size="11" text-anchor="middle">x</text>
    <text x="128" y="61" fill="#f38ba8" font-family="sans-serif" font-size="11" text-anchor="middle">35</text>

    <!-- POC row - highlighted -->
    <text x="42" y="89" fill="#a6e3a1" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">156</text>
    <text x="85" y="89" fill="#585b70" font-family="sans-serif" font-size="11" text-anchor="middle">x</text>
    <text x="128" y="89" fill="#f38ba8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">48</text>

    <!-- Stacked imbalance rows -->
    <text x="42" y="117" fill="#a6e3a1" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">89</text>
    <text x="85" y="117" fill="#585b70" font-family="sans-serif" font-size="11" text-anchor="middle">x</text>
    <text x="128" y="117" fill="#f38ba8" font-family="sans-serif" font-size="11" text-anchor="middle">22</text>

    <text x="42" y="145" fill="#a6e3a1" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">67</text>
    <text x="85" y="145" fill="#585b70" font-family="sans-serif" font-size="11" text-anchor="middle">x</text>
    <text x="128" y="145" fill="#f38ba8" font-family="sans-serif" font-size="11" text-anchor="middle">18</text>

    <text x="42" y="173" fill="#a6e3a1" font-family="sans-serif" font-size="11" text-anchor="middle">15</text>
    <text x="85" y="173" fill="#585b70" font-family="sans-serif" font-size="11" text-anchor="middle">x</text>
    <text x="128" y="173" fill="#f38ba8" font-family="sans-serif" font-size="11" text-anchor="middle">30</text>

    <!-- POC marker -->
    <line x1="174" y1="85" x2="185" y2="85" stroke="#f9e2af" stroke-width="2"/>
    <text x="190" y="89" fill="#f9e2af" font-family="sans-serif" font-size="9" font-weight="bold">POC</text>

    <!-- Imbalance bracket -->
    <line x1="174" y1="75" x2="180" y2="75" stroke="#a6e3a1" stroke-width="1.5"/>
    <line x1="180" y1="75" x2="180" y2="153" stroke="#a6e3a1" stroke-width="1.5"/>
    <line x1="174" y1="153" x2="180" y2="153" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="186" y="118" fill="#a6e3a1" font-family="sans-serif" font-size="8">Stacked</text>
    <text x="186" y="128" fill="#a6e3a1" font-family="sans-serif" font-size="8">buy</text>
    <text x="186" y="138" fill="#a6e3a1" font-family="sans-serif" font-size="8">imbalance</text>
  </g>

  <!-- Annotations on right -->
  <g transform="translate(320, 55)">
    <text x="0" y="0" fill="#cdd6f4" font-family="sans-serif" font-size="12" font-weight="bold">Reading Footprints</text>

    <rect x="0" y="15" width="190" height="50" fill="#a6e3a1" fill-opacity="0.06" rx="4"/>
    <text x="10" y="33" fill="#a6e3a1" font-family="sans-serif" font-size="10" font-weight="bold">Imbalance (3:1+)</text>
    <text x="10" y="48" fill="#585b70" font-family="sans-serif" font-size="9">One side dominates a level</text>
    <text x="10" y="60" fill="#585b70" font-family="sans-serif" font-size="9">156 x 48 = 3.25:1 buy</text>

    <rect x="0" y="75" width="190" height="50" fill="#f9e2af" fill-opacity="0.06" rx="4"/>
    <text x="10" y="93" fill="#f9e2af" font-family="sans-serif" font-size="10" font-weight="bold">Stacked Imbalances</text>
    <text x="10" y="108" fill="#585b70" font-family="sans-serif" font-size="9">3+ consecutive levels with</text>
    <text x="10" y="120" fill="#585b70" font-family="sans-serif" font-size="9">same-side imbalance = strong</text>

    <rect x="0" y="135" width="190" height="50" fill="#cba6f7" fill-opacity="0.06" rx="4"/>
    <text x="10" y="153" fill="#cba6f7" font-family="sans-serif" font-size="10" font-weight="bold">Absorption</text>
    <text x="10" y="168" fill="#585b70" font-family="sans-serif" font-size="9">High volume + small price move</text>
    <text x="10" y="180" fill="#585b70" font-family="sans-serif" font-size="9">= big player absorbing flow</text>
  </g>
</svg>
