<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220">
  <rect width="560" height="220" fill="#000000" fill-opacity="0.3" rx="8"/>

  <text x="280" y="24" fill="#cdd6f4" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Range Position</text>

  <!-- Chart area -->
  <g transform="translate(55, 36)">
    <!-- Zone backgrounds -->
    <!-- Sell zone (top, red) -->
    <rect x="0" y="0" width="440" height="40" fill="#f38ba8" opacity="0.1"/>
    <!-- Neutral zone (middle) -->
    <rect x="0" y="40" width="440" height="80" fill="#585b70" opacity="0.03"/>
    <!-- Buy zone (bottom, green) -->
    <rect x="0" y="120" width="440" height="40" fill="#a6e3a1" opacity="0.1"/>

    <!-- Boundary lines -->
    <line x1="0" y1="0" x2="440" y2="0" stroke="#f38ba8" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="0" y1="40" x2="440" y2="40" stroke="#585b70" stroke-width="1" stroke-dasharray="2,6"/>
    <line x1="0" y1="80" x2="440" y2="80" stroke="#585b70" stroke-width="1" stroke-dasharray="2,4"/>
    <line x1="0" y1="120" x2="440" y2="120" stroke="#585b70" stroke-width="1" stroke-dasharray="2,6"/>
    <line x1="0" y1="160" x2="440" y2="160" stroke="#a6e3a1" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- Scale labels (left) -->
    <text x="-8" y="5" fill="#f38ba8" font-family="sans-serif" font-size="11" text-anchor="end">+1.0</text>
    <text x="-8" y="44" fill="#7f849c" font-family="sans-serif" font-size="10" text-anchor="end">+0.5</text>
    <text x="-8" y="84" fill="#7f849c" font-family="sans-serif" font-size="11" text-anchor="end">0</text>
    <text x="-8" y="124" fill="#7f849c" font-family="sans-serif" font-size="10" text-anchor="end">-0.5</text>
    <text x="-8" y="164" fill="#a6e3a1" font-family="sans-serif" font-size="11" text-anchor="end">-1.0</text>

    <!-- Zone labels (right) -->
    <text x="450" y="16" fill="#f38ba8" font-family="sans-serif" font-size="10">Sell zone</text>
    <text x="450" y="148" fill="#a6e3a1" font-family="sans-serif" font-size="10">Buy zone</text>

    <!-- High/Low channel bounds (stepped) -->
    <polyline
      points="0,10 55,10 110,5 165,8 220,15 275,10 330,5 385,12 440,8"
      fill="none" stroke="#585b70" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
    <polyline
      points="0,150 55,155 110,148 165,152 220,158 275,150 330,148 385,155 440,152"
      fill="none" stroke="#585b70" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
    <text x="440" y="7" fill="#585b70" font-family="sans-serif" font-size="8" opacity="0.7">HIGH</text>
    <text x="440" y="163" fill="#585b70" font-family="sans-serif" font-size="8" opacity="0.7">LOW</text>

    <!-- Range Position line -->
    <polyline
      points="0,80 18,72 36,60 55,45 73,35 91,28 110,40 128,55 146,70 165,85 183,95 201,110 220,130 238,145 256,150 275,140 293,120 311,100 330,80 348,65 366,50 385,35 403,25 421,15 440,30"
      fill="none" stroke="#cba6f7" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Buy signal near bottom -->
    <circle cx="256" cy="150" r="5" fill="#a6e3a1"/>
    <text x="256" y="168" fill="#a6e3a1" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">BUY (-0.9)</text>

    <!-- Sell signal near top -->
    <circle cx="403" cy="25" r="5" fill="#f38ba8"/>
    <text x="403" y="16" fill="#f38ba8" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">SELL (+0.9)</text>

    <!-- Midpoint label -->
    <text x="165" y="96" fill="#7f849c" font-family="sans-serif" font-size="8" text-anchor="middle">midpoint</text>

    <!-- Axes -->
    <line x1="0" y1="0" x2="0" y2="160" stroke="#585b70" stroke-width="1"/>
    <line x1="0" y1="160" x2="440" y2="160" stroke="#585b70" stroke-width="1"/>
  </g>
</svg>
