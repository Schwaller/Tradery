<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260">
  <rect width="560" height="260" fill="#000000" fill-opacity="0.3" rx="8"/>
  <text x="280" y="28" fill="#cdd6f4" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Trendlines</text>

  <g transform="translate(40, 45)">
    <!-- Axes -->
    <line x1="0" y1="0" x2="0" y2="180" stroke="#585b70" stroke-width="1"/>
    <line x1="0" y1="180" x2="480" y2="180" stroke="#585b70" stroke-width="1"/>
    <text x="-8" y="95" fill="#7f849c" font-family="sans-serif" font-size="9" text-anchor="end" transform="rotate(-90, -8, 95)">Price</text>
    <text x="240" y="198" fill="#7f849c" font-family="sans-serif" font-size="9" text-anchor="middle">Time</text>

    <!-- Ascending trendline (left half) -->
    <line x1="10" y1="160" x2="220" y2="60" stroke="#a6e3a1" stroke-width="2" stroke-dasharray="6,3"/>

    <!-- Price action bouncing off ascending trendline -->
    <polyline points="10,155 25,145 40,160 55,140 70,130 85,145 100,125 115,115 130,130 145,110 160,100 175,115 190,95 205,85 220,65"
      fill="none" stroke="#cdd6f4" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Touch points on ascending trendline -->
    <circle cx="40" cy="160" r="4" fill="none" stroke="#a6e3a1" stroke-width="1.5"/>
    <circle cx="85" cy="145" r="4" fill="none" stroke="#a6e3a1" stroke-width="1.5"/>
    <circle cx="130" cy="130" r="4" fill="none" stroke="#a6e3a1" stroke-width="1.5"/>
    <circle cx="175" cy="115" r="4" fill="none" stroke="#a6e3a1" stroke-width="1.5"/>

    <text x="115" y="175" fill="#a6e3a1" font-family="sans-serif" font-size="10" text-anchor="middle">Ascending Trendline</text>
    <text x="115" y="187" fill="#585b70" font-family="sans-serif" font-size="8" text-anchor="middle">Connects higher lows</text>

    <!-- Descending trendline (right half) -->
    <line x1="260" y1="50" x2="470" y2="150" stroke="#f38ba8" stroke-width="2" stroke-dasharray="6,3"/>

    <!-- Price action bouncing off descending trendline -->
    <polyline points="260,55 275,65 290,50 305,70 320,80 335,65 350,85 365,95 380,80 395,100 410,110 425,95 440,115 455,125 470,145"
      fill="none" stroke="#cdd6f4" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Touch points on descending trendline -->
    <circle cx="290" cy="50" r="4" fill="none" stroke="#f38ba8" stroke-width="1.5"/>
    <circle cx="335" cy="65" r="4" fill="none" stroke="#f38ba8" stroke-width="1.5"/>
    <circle cx="380" cy="80" r="4" fill="none" stroke="#f38ba8" stroke-width="1.5"/>
    <circle cx="425" cy="95" r="4" fill="none" stroke="#f38ba8" stroke-width="1.5"/>

    <text x="365" y="175" fill="#f38ba8" font-family="sans-serif" font-size="10" text-anchor="middle">Descending Trendline</text>
    <text x="365" y="187" fill="#585b70" font-family="sans-serif" font-size="8" text-anchor="middle">Connects lower highs</text>
  </g>
</svg>
