<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260">
  <rect width="560" height="260" fill="#000000" fill-opacity="0.3" rx="8"/>
  <text x="280" y="28" fill="#cdd6f4" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Trendlines</text>

  <g transform="translate(40, 45)">
    <!-- Axes -->
    <line x1="0" y1="0" x2="0" y2="180" stroke="#585b70" stroke-width="1"/>
    <line x1="0" y1="180" x2="480" y2="180" stroke="#585b70" stroke-width="1"/>
    <text x="-8" y="95" fill="#7f849c" font-family="sans-serif" font-size="9" text-anchor="end" transform="rotate(-90, -8, 95)">Price</text>
    <text x="240" y="198" fill="#7f849c" font-family="sans-serif" font-size="9" text-anchor="middle">Time</text>

    <!-- === Ascending trendline (left half) === -->
    <!-- Touch points: (30,158) (80,141) (135,122) (190,103) — slope: -55/160 -->
    <!-- Trendline through all four touch points -->
    <line x1="10" y1="165" x2="220" y2="93" stroke="#a6e3a1" stroke-width="2" stroke-dasharray="6,3"/>

    <!-- Price action: rises from trendline, pulls back to touch, rises again -->
    <polyline points="15,160 30,158 45,140 55,132 65,142 80,141 95,120 105,110 120,125 135,122 150,100 160,92 175,108 190,103 205,82 220,75"
      fill="none" stroke="#cdd6f4" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Touch points on ascending trendline -->
    <circle cx="30" cy="158" r="4" fill="none" stroke="#a6e3a1" stroke-width="1.5"/>
    <circle cx="80" cy="141" r="4" fill="none" stroke="#a6e3a1" stroke-width="1.5"/>
    <circle cx="135" cy="122" r="4" fill="none" stroke="#a6e3a1" stroke-width="1.5"/>
    <circle cx="190" cy="103" r="4" fill="none" stroke="#a6e3a1" stroke-width="1.5"/>

    <text x="115" y="177" fill="#a6e3a1" font-family="sans-serif" font-size="10" text-anchor="middle">Ascending Trendline</text>
    <text x="115" y="189" fill="#585b70" font-family="sans-serif" font-size="8" text-anchor="middle">Connects higher lows</text>

    <!-- === Descending trendline (right half) === -->
    <!-- Touch points: (280,52) (330,69) (385,88) (440,107) — slope: 55/160 -->
    <!-- Trendline through all four touch points -->
    <line x1="260" y1="45" x2="470" y2="117" stroke="#f38ba8" stroke-width="2" stroke-dasharray="6,3"/>

    <!-- Price action: drops from trendline, bounces up to touch, drops again -->
    <polyline points="265,48 280,52 295,70 305,82 315,68 330,69 345,90 355,100 370,85 385,88 400,108 410,118 425,102 440,107 455,128 470,140"
      fill="none" stroke="#cdd6f4" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Touch points on descending trendline -->
    <circle cx="280" cy="52" r="4" fill="none" stroke="#f38ba8" stroke-width="1.5"/>
    <circle cx="330" cy="69" r="4" fill="none" stroke="#f38ba8" stroke-width="1.5"/>
    <circle cx="385" cy="88" r="4" fill="none" stroke="#f38ba8" stroke-width="1.5"/>
    <circle cx="440" cy="107" r="4" fill="none" stroke="#f38ba8" stroke-width="1.5"/>

    <text x="365" y="177" fill="#f38ba8" font-family="sans-serif" font-size="10" text-anchor="middle">Descending Trendline</text>
    <text x="365" y="189" fill="#585b70" font-family="sans-serif" font-size="8" text-anchor="middle">Connects lower highs</text>
  </g>
</svg>
