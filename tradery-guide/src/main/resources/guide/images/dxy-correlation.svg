<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240">
  <rect width="560" height="240" fill="#000000" fill-opacity="0.3" rx="8"/>
  <text x="280" y="28" fill="#cdd6f4" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">DXY vs Bitcoin — Inverse Correlation</text>

  <g transform="translate(50, 48)">
    <!-- Axes -->
    <line x1="0" y1="0" x2="0" y2="150" stroke="#585b70" stroke-width="1"/>
    <line x1="0" y1="150" x2="470" y2="150" stroke="#585b70" stroke-width="1"/>

    <!-- Y-axis left: DXY (inverted: high at bottom) -->
    <text x="-8" y="8" fill="#89b4fa" font-family="sans-serif" font-size="9" text-anchor="end">96</text>
    <text x="-8" y="50" fill="#89b4fa" font-family="sans-serif" font-size="9" text-anchor="end">100</text>
    <text x="-8" y="95" fill="#89b4fa" font-family="sans-serif" font-size="9" text-anchor="end">105</text>
    <text x="-8" y="145" fill="#89b4fa" font-family="sans-serif" font-size="9" text-anchor="end">114</text>
    <text x="-28" y="78" fill="#89b4fa" font-family="sans-serif" font-size="8" text-anchor="middle" transform="rotate(-90,-28,78)">DXY (inverted)</text>

    <!-- Y-axis right: BTC -->
    <text x="478" y="8" fill="#cba6f7" font-family="sans-serif" font-size="9" text-anchor="start">$70K</text>
    <text x="478" y="50" fill="#cba6f7" font-family="sans-serif" font-size="9" text-anchor="start">$45K</text>
    <text x="478" y="95" fill="#cba6f7" font-family="sans-serif" font-size="9" text-anchor="start">$25K</text>
    <text x="478" y="145" fill="#cba6f7" font-family="sans-serif" font-size="9" text-anchor="start">$15K</text>

    <!-- Grid -->
    <line x1="0" y1="50" x2="470" y2="50" stroke="#585b70" stroke-width="0.5" stroke-opacity="0.15"/>
    <line x1="0" y1="100" x2="470" y2="100" stroke="#585b70" stroke-width="0.5" stroke-opacity="0.15"/>

    <!-- X-axis labels -->
    <text x="0" y="165" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="middle">2021</text>
    <text x="117" y="165" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="middle">2022</text>
    <text x="235" y="165" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="middle">2023</text>
    <text x="352" y="165" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="middle">2024</text>
    <text x="470" y="165" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="middle">2025</text>

    <!-- Correlation highlight zone: both move together (inverse) -->
    <rect x="85" y="0" width="180" height="150" fill="#f38ba8" fill-opacity="0.04"/>
    <text x="175" y="145" fill="#f38ba8" font-family="sans-serif" font-size="7" opacity="0.6" text-anchor="middle">Strong inverse correlation</text>

    <!-- DXY line (inverted: low DXY = high on chart) - blue -->
    <polyline fill="none" stroke="#89b4fa" stroke-width="2"
      points="0,20 20,18 40,25 60,30 80,28 100,45 120,65 140,90 160,110 180,130 195,140 210,135 230,120 250,100 270,80 290,70 310,60 330,50 350,45 370,38 390,30 410,25 430,30 450,35 470,28"/>

    <!-- BTC price line - purple -->
    <polyline fill="none" stroke="#cba6f7" stroke-width="2"
      points="0,5 20,8 40,15 60,12 80,30 100,55 120,80 140,100 160,115 180,130 195,135 210,120 230,105 240,115 250,105 270,95 290,85 310,75 330,65 350,50 370,35 390,20 410,12 430,8 450,15 470,10"/>

    <!-- Divergence callout -->
    <rect x="310" y="56" width="70" height="20" fill="#f9e2af" fill-opacity="0.1" rx="3" stroke="#f9e2af" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="345" y="70" fill="#f9e2af" font-family="sans-serif" font-size="7" text-anchor="middle">ETF divergence</text>
  </g>

  <!-- Legend -->
  <line x1="130" y1="225" x2="150" y2="225" stroke="#89b4fa" stroke-width="2"/>
  <text x="155" y="228" fill="#89b4fa" font-family="sans-serif" font-size="9">DXY (inverted)</text>
  <line x1="290" y1="225" x2="310" y2="225" stroke="#cba6f7" stroke-width="2"/>
  <text x="315" y="228" fill="#cba6f7" font-family="sans-serif" font-size="9">BTC Price</text>
</svg>
