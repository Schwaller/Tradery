<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280">
  <rect width="560" height="280" fill="#000000" fill-opacity="0.3" rx="8"/>

  <text x="280" y="28" fill="#cdd6f4" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Risk-Reward Ratio</text>

  <!-- 1:2 R:R Example -->
  <g transform="translate(80, 50)">
    <text x="60" y="10" fill="#cdd6f4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">1:2 R:R</text>

    <!-- Entry line -->
    <line x1="0" y1="130" x2="120" y2="130" stroke="#89b4fa" stroke-width="2"/>
    <text x="130" y="134" fill="#89b4fa" font-family="sans-serif" font-size="11">Entry</text>

    <!-- Take profit -->
    <line x1="0" y1="40" x2="120" y2="40" stroke="#a6e3a1" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="130" y="44" fill="#a6e3a1" font-family="sans-serif" font-size="11">Take Profit</text>

    <!-- Stop loss -->
    <line x1="0" y1="175" x2="120" y2="175" stroke="#f38ba8" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="130" y="179" fill="#f38ba8" font-family="sans-serif" font-size="11">Stop Loss</text>

    <!-- Reward bracket -->
    <line x1="-15" y1="42" x2="-15" y2="128" stroke="#a6e3a1" stroke-width="1.5"/>
    <line x1="-20" y1="42" x2="-10" y2="42" stroke="#a6e3a1" stroke-width="1.5"/>
    <line x1="-20" y1="128" x2="-10" y2="128" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="-25" y="90" fill="#a6e3a1" font-family="sans-serif" font-size="10" text-anchor="end">+2R</text>

    <!-- Risk bracket -->
    <line x1="-15" y1="132" x2="-15" y2="173" stroke="#f38ba8" stroke-width="1.5"/>
    <line x1="-20" y1="132" x2="-10" y2="132" stroke="#f38ba8" stroke-width="1.5"/>
    <line x1="-20" y1="173" x2="-10" y2="173" stroke="#f38ba8" stroke-width="1.5"/>
    <text x="-25" y="157" fill="#f38ba8" font-family="sans-serif" font-size="10" text-anchor="end">-1R</text>

    <!-- Win rate needed -->
    <text x="60" y="215" fill="#585b70" font-family="sans-serif" font-size="10" text-anchor="middle">Break-even: 34% wins</text>
  </g>

  <!-- 1:3 R:R Example -->
  <g transform="translate(340, 50)">
    <text x="60" y="10" fill="#cdd6f4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">1:3 R:R</text>

    <!-- Entry line -->
    <line x1="0" y1="150" x2="120" y2="150" stroke="#89b4fa" stroke-width="2"/>
    <text x="130" y="154" fill="#89b4fa" font-family="sans-serif" font-size="11">Entry</text>

    <!-- Take profit -->
    <line x1="0" y1="30" x2="120" y2="30" stroke="#a6e3a1" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="130" y="34" fill="#a6e3a1" font-family="sans-serif" font-size="11">Take Profit</text>

    <!-- Stop loss -->
    <line x1="0" y1="190" x2="120" y2="190" stroke="#f38ba8" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="130" y="194" fill="#f38ba8" font-family="sans-serif" font-size="11">Stop Loss</text>

    <!-- Reward bracket -->
    <line x1="-15" y1="32" x2="-15" y2="148" stroke="#a6e3a1" stroke-width="1.5"/>
    <line x1="-20" y1="32" x2="-10" y2="32" stroke="#a6e3a1" stroke-width="1.5"/>
    <line x1="-20" y1="148" x2="-10" y2="148" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="-25" y="95" fill="#a6e3a1" font-family="sans-serif" font-size="10" text-anchor="end">+3R</text>

    <!-- Risk bracket -->
    <line x1="-15" y1="152" x2="-15" y2="188" stroke="#f38ba8" stroke-width="1.5"/>
    <line x1="-20" y1="152" x2="-10" y2="152" stroke="#f38ba8" stroke-width="1.5"/>
    <line x1="-20" y1="188" x2="-10" y2="188" stroke="#f38ba8" stroke-width="1.5"/>
    <text x="-25" y="175" fill="#f38ba8" font-family="sans-serif" font-size="10" text-anchor="end">-1R</text>

    <!-- Win rate needed -->
    <text x="60" y="215" fill="#585b70" font-family="sans-serif" font-size="10" text-anchor="middle">Break-even: 26% wins</text>
  </g>
</svg>
