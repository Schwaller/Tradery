<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320">
  <rect width="560" height="320" fill="#000000" fill-opacity="0.3" rx="8"/>
  <text x="280" y="28" fill="#cdd6f4" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Phase System: Multi-Dimensional Filters</text>

  <!-- Phase categories as columns -->
  <g transform="translate(30, 50)">
    <!-- Session -->
    <rect x="0" y="0" width="80" height="24" fill="#89b4fa" fill-opacity="0.15" rx="4"/>
    <text x="40" y="16" fill="#89b4fa" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Session</text>
    <text x="40" y="38" fill="#7f849c" font-family="sans-serif" font-size="8" text-anchor="middle">asian</text>
    <text x="40" y="50" fill="#7f849c" font-family="sans-serif" font-size="8" text-anchor="middle">european</text>
    <text x="40" y="62" fill="#7f849c" font-family="sans-serif" font-size="8" text-anchor="middle">us-market</text>
    <text x="40" y="74" fill="#7f849c" font-family="sans-serif" font-size="8" text-anchor="middle">overlap</text>

    <!-- Trend -->
    <rect x="100" y="0" width="80" height="24" fill="#a6e3a1" fill-opacity="0.15" rx="4"/>
    <text x="140" y="16" fill="#a6e3a1" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Trend</text>
    <text x="140" y="38" fill="#7f849c" font-family="sans-serif" font-size="8" text-anchor="middle">uptrend</text>
    <text x="140" y="50" fill="#7f849c" font-family="sans-serif" font-size="8" text-anchor="middle">downtrend</text>
    <text x="140" y="62" fill="#7f849c" font-family="sans-serif" font-size="8" text-anchor="middle">ranging</text>
    <text x="140" y="74" fill="#7f849c" font-family="sans-serif" font-size="8" text-anchor="middle">golden-cross</text>

    <!-- Momentum -->
    <rect x="200" y="0" width="80" height="24" fill="#fab387" fill-opacity="0.15" rx="4"/>
    <text x="240" y="16" fill="#fab387" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Momentum</text>
    <text x="240" y="38" fill="#7f849c" font-family="sans-serif" font-size="8" text-anchor="middle">overbought</text>
    <text x="240" y="50" fill="#7f849c" font-family="sans-serif" font-size="8" text-anchor="middle">oversold</text>

    <!-- Calendar -->
    <rect x="300" y="0" width="80" height="24" fill="#cba6f7" fill-opacity="0.15" rx="4"/>
    <text x="340" y="16" fill="#cba6f7" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Calendar</text>
    <text x="340" y="38" fill="#7f849c" font-family="sans-serif" font-size="8" text-anchor="middle">fomc-day</text>
    <text x="340" y="50" fill="#7f849c" font-family="sans-serif" font-size="8" text-anchor="middle">us-holiday</text>
    <text x="340" y="62" fill="#7f849c" font-family="sans-serif" font-size="8" text-anchor="middle">month-end</text>

    <!-- Sentiment -->
    <rect x="400" y="0" width="100" height="24" fill="#f38ba8" fill-opacity="0.15" rx="4"/>
    <text x="450" y="16" fill="#f38ba8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Sentiment</text>
    <text x="450" y="38" fill="#7f849c" font-family="sans-serif" font-size="8" text-anchor="middle">extreme-fear</text>
    <text x="450" y="50" fill="#7f849c" font-family="sans-serif" font-size="8" text-anchor="middle">extreme-greed</text>
    <text x="450" y="62" fill="#7f849c" font-family="sans-serif" font-size="8" text-anchor="middle">high-funding</text>
    <text x="450" y="74" fill="#7f849c" font-family="sans-serif" font-size="8" text-anchor="middle">neg-funding</text>
  </g>

  <!-- Filter logic -->
  <g transform="translate(30, 150)">
    <!-- Arrows down from categories -->
    <line x1="250" y1="0" x2="250" y2="20" stroke="#585b70" stroke-width="1.5" marker-end="url(#arrowGray)"/>

    <!-- Required box -->
    <rect x="60" y="25" width="180" height="45" fill="#a6e3a1" fill-opacity="0.08" rx="5" stroke="#a6e3a1" stroke-width="1" stroke-opacity="0.3"/>
    <text x="150" y="42" fill="#a6e3a1" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Required Phases</text>
    <text x="150" y="56" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="middle">ALL must be active to trade</text>
    <text x="150" y="68" fill="#7f849c" font-family="sans-serif" font-size="8" text-anchor="middle">[uptrend] AND [us-market]</text>

    <!-- Excluded box -->
    <rect x="270" y="25" width="180" height="45" fill="#f38ba8" fill-opacity="0.08" rx="5" stroke="#f38ba8" stroke-width="1" stroke-opacity="0.3"/>
    <text x="360" y="42" fill="#f38ba8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Excluded Phases</text>
    <text x="360" y="56" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="middle">NONE must be active to trade</text>
    <text x="360" y="68" fill="#7f849c" font-family="sans-serif" font-size="8" text-anchor="middle">[fomc-day] AND [us-holiday]</text>

    <!-- Arrow down to result -->
    <line x1="250" y1="75" x2="250" y2="95" stroke="#585b70" stroke-width="1.5"/>

    <!-- Result -->
    <rect x="100" y="98" width="310" height="40" fill="#cba6f7" fill-opacity="0.08" rx="5" stroke="#cba6f7" stroke-width="1" stroke-opacity="0.3"/>
    <text x="255" y="115" fill="#cba6f7" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Entry Signal Allowed</text>
    <text x="255" y="130" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="middle">Phases pass + DSL condition true = trade opens</text>
  </g>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#585b70" stroke-width="1"/>
    </marker>
  </defs>
</svg>
