<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520">
  <rect width="560" height="520" fill="#000000" fill-opacity="0.3" rx="8"/>
  <text x="280" y="24" fill="#cdd6f4" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Spot vs Perpetual Futures</text>

  <!-- === TOP SECTION: Side-by-side mechanics === -->

  <!-- Spot side -->
  <g transform="translate(15, 40)">
    <rect x="0" y="0" width="255" height="200" fill="#313244" fill-opacity="0.4" rx="6"/>
    <text x="127" y="20" fill="#a6e3a1" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Spot Market</text>
    <text x="127" y="35" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="middle">Buy the actual asset</text>

    <!-- Flow: USD → Exchange → BTC -->
    <rect x="15" y="52" width="60" height="30" fill="#a6e3a1" fill-opacity="0.15" stroke="#a6e3a1" stroke-width="1" rx="4"/>
    <text x="45" y="71" fill="#a6e3a1" font-family="sans-serif" font-size="10" text-anchor="middle">USD</text>

    <line x1="80" y1="67" x2="97" y2="67" stroke="#585b70" stroke-width="1.2" marker-end="url(#arrow)"/>

    <rect x="100" y="52" width="60" height="30" fill="#585b70" fill-opacity="0.2" stroke="#585b70" stroke-width="1" rx="4"/>
    <text x="130" y="71" fill="#cdd6f4" font-family="sans-serif" font-size="10" text-anchor="middle">Exchange</text>

    <line x1="165" y1="67" x2="182" y2="67" stroke="#585b70" stroke-width="1.2" marker-end="url(#arrow)"/>

    <rect x="185" y="52" width="60" height="30" fill="#fab387" fill-opacity="0.15" stroke="#fab387" stroke-width="1" rx="4"/>
    <text x="215" y="71" fill="#fab387" font-family="sans-serif" font-size="10" text-anchor="middle">BTC</text>

    <!-- Properties -->
    <text x="20" y="104" fill="#a6e3a1" font-family="sans-serif" font-size="9">&#x2713;</text>
    <text x="32" y="104" fill="#bac2de" font-family="sans-serif" font-size="9">You own the asset</text>
    <text x="20" y="119" fill="#a6e3a1" font-family="sans-serif" font-size="9">&#x2713;</text>
    <text x="32" y="119" fill="#bac2de" font-family="sans-serif" font-size="9">No expiry, no funding</text>
    <text x="20" y="134" fill="#a6e3a1" font-family="sans-serif" font-size="9">&#x2713;</text>
    <text x="32" y="134" fill="#bac2de" font-family="sans-serif" font-size="9">Can withdraw to wallet</text>
    <text x="20" y="149" fill="#f38ba8" font-family="sans-serif" font-size="9">&#x2717;</text>
    <text x="32" y="149" fill="#bac2de" font-family="sans-serif" font-size="9">No shorting (usually)</text>
    <text x="20" y="164" fill="#f38ba8" font-family="sans-serif" font-size="9">&#x2717;</text>
    <text x="32" y="164" fill="#bac2de" font-family="sans-serif" font-size="9">No leverage</text>
    <text x="20" y="179" fill="#f38ba8" font-family="sans-serif" font-size="9">&#x2717;</text>
    <text x="32" y="179" fill="#bac2de" font-family="sans-serif" font-size="9">Need full capital upfront</text>
    <text x="20" y="194" fill="#585b70" font-family="sans-serif" font-size="8">Volume: ~$15-25B/day (BTC)</text>
  </g>

  <!-- Futures side -->
  <g transform="translate(290, 40)">
    <rect x="0" y="0" width="255" height="200" fill="#313244" fill-opacity="0.4" rx="6"/>
    <text x="127" y="20" fill="#89b4fa" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Perpetual Futures</text>
    <text x="127" y="35" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="middle">Trade a contract tracking the asset</text>

    <!-- Flow: Margin → Contract → P&L -->
    <rect x="15" y="52" width="60" height="30" fill="#89b4fa" fill-opacity="0.15" stroke="#89b4fa" stroke-width="1" rx="4"/>
    <text x="45" y="71" fill="#89b4fa" font-family="sans-serif" font-size="10" text-anchor="middle">Margin</text>

    <line x1="80" y1="67" x2="97" y2="67" stroke="#585b70" stroke-width="1.2" marker-end="url(#arrow)"/>

    <rect x="100" y="52" width="60" height="30" fill="#585b70" fill-opacity="0.2" stroke="#585b70" stroke-width="1" rx="4"/>
    <text x="130" y="71" fill="#cdd6f4" font-family="sans-serif" font-size="10" text-anchor="middle">Contract</text>

    <line x1="165" y1="67" x2="182" y2="67" stroke="#585b70" stroke-width="1.2" marker-end="url(#arrow)"/>

    <rect x="185" y="52" width="60" height="30" fill="#f9e2af" fill-opacity="0.15" stroke="#f9e2af" stroke-width="1" rx="4"/>
    <text x="215" y="71" fill="#f9e2af" font-family="sans-serif" font-size="10" text-anchor="middle">P&amp;L</text>

    <!-- Properties -->
    <text x="20" y="104" fill="#a6e3a1" font-family="sans-serif" font-size="9">&#x2713;</text>
    <text x="32" y="104" fill="#bac2de" font-family="sans-serif" font-size="9">Long or short equally</text>
    <text x="20" y="119" fill="#a6e3a1" font-family="sans-serif" font-size="9">&#x2713;</text>
    <text x="32" y="119" fill="#bac2de" font-family="sans-serif" font-size="9">Up to 125x leverage</text>
    <text x="20" y="134" fill="#a6e3a1" font-family="sans-serif" font-size="9">&#x2713;</text>
    <text x="32" y="134" fill="#bac2de" font-family="sans-serif" font-size="9">No expiry date</text>
    <text x="20" y="149" fill="#f38ba8" font-family="sans-serif" font-size="9">&#x2717;</text>
    <text x="32" y="149" fill="#bac2de" font-family="sans-serif" font-size="9">Pay/receive funding every 8h</text>
    <text x="20" y="164" fill="#f38ba8" font-family="sans-serif" font-size="9">&#x2717;</text>
    <text x="32" y="164" fill="#bac2de" font-family="sans-serif" font-size="9">Liquidation risk</text>
    <text x="20" y="179" fill="#f38ba8" font-family="sans-serif" font-size="9">&#x2717;</text>
    <text x="32" y="179" fill="#bac2de" font-family="sans-serif" font-size="9">You never own the asset</text>
    <text x="20" y="194" fill="#585b70" font-family="sans-serif" font-size="8">Volume: ~$40-80B/day (BTC)</text>
  </g>

  <!-- === MIDDLE SECTION: Funding mechanism === -->
  <g transform="translate(15, 254)">
    <rect x="0" y="0" width="530" height="90" fill="#313244" fill-opacity="0.3" rx="6"/>
    <text x="265" y="18" fill="#f9e2af" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">The Funding Rate Anchor</text>

    <!-- Spot price line -->
    <line x1="30" y1="45" x2="500" y2="45" stroke="#a6e3a1" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="510" y="49" fill="#a6e3a1" font-family="sans-serif" font-size="8">Spot</text>

    <!-- Futures price oscillating around spot -->
    <path d="M30,42 Q70,30 110,38 Q150,48 190,52 Q230,56 265,44 Q300,32 340,36 Q380,42 420,48 Q460,52 500,43" fill="none" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="510" y="38" fill="#89b4fa" font-family="sans-serif" font-size="8">Perp</text>

    <!-- Premium labels -->
    <text x="130" y="33" fill="#a6e3a1" font-family="sans-serif" font-size="7">+premium</text>
    <line x1="130" y1="35" x2="130" y2="45" stroke="#a6e3a1" stroke-width="0.5" stroke-dasharray="2,2"/>

    <text x="225" y="63" fill="#f38ba8" font-family="sans-serif" font-size="7">-discount</text>
    <line x1="225" y1="50" x2="225" y2="55" stroke="#f38ba8" stroke-width="0.5" stroke-dasharray="2,2"/>

    <!-- Funding arrows -->
    <text x="350" y="32" fill="#f9e2af" font-family="sans-serif" font-size="7">Funding pulls</text>
    <text x="350" y="41" fill="#f9e2af" font-family="sans-serif" font-size="7">perp → spot</text>
    <path d="M390,44 C395,60 400,60 405,48" fill="none" stroke="#f9e2af" stroke-width="0.8" marker-end="url(#arrowYellow)"/>

    <!-- Explanation -->
    <text x="265" y="80" fill="#585b70" font-family="sans-serif" font-size="8" text-anchor="middle">When perp trades above spot → longs pay shorts (positive funding) → incentivizes selling → perp falls back to spot</text>
  </g>

  <!-- === BOTTOM SECTION: Volume dominance over time === -->
  <g transform="translate(15, 358)">
    <rect x="0" y="0" width="530" height="148" fill="#313244" fill-opacity="0.3" rx="6"/>
    <text x="265" y="18" fill="#cdd6f4" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Futures vs Spot Volume Dominance (BTC)</text>

    <!-- Y axis -->
    <line x1="50" y1="30" x2="50" y2="120" stroke="#585b70" stroke-width="0.8"/>
    <text x="45" y="35" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="end">100%</text>
    <text x="45" y="58" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="end">75%</text>
    <text x="45" y="80" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="end">50%</text>
    <text x="45" y="102" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="end">25%</text>
    <text x="45" y="124" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="end">0%</text>

    <!-- X axis -->
    <line x1="50" y1="120" x2="510" y2="120" stroke="#585b70" stroke-width="0.8"/>

    <!-- Year labels -->
    <text x="90" y="133" fill="#585b70" font-family="sans-serif" font-size="8" text-anchor="middle">2019</text>
    <text x="167" y="133" fill="#585b70" font-family="sans-serif" font-size="8" text-anchor="middle">2020</text>
    <text x="244" y="133" fill="#585b70" font-family="sans-serif" font-size="8" text-anchor="middle">2021</text>
    <text x="321" y="133" fill="#585b70" font-family="sans-serif" font-size="8" text-anchor="middle">2022</text>
    <text x="398" y="133" fill="#585b70" font-family="sans-serif" font-size="8" text-anchor="middle">2023</text>
    <text x="475" y="133" fill="#585b70" font-family="sans-serif" font-size="8" text-anchor="middle">2024</text>

    <!-- Futures share area (growing from ~30% to ~75%) -->
    <path d="M60,93 L90,89 L130,85 L167,76 L200,72 L244,65 L280,58 L321,52 L360,48 L398,44 L440,40 L475,38 L505,36
             L505,120 L60,120 Z" fill="#89b4fa" fill-opacity="0.2"/>
    <path d="M60,93 L90,89 L130,85 L167,76 L200,72 L244,65 L280,58 L321,52 L360,48 L398,44 L440,40 L475,38 L505,36" fill="none" stroke="#89b4fa" stroke-width="1.5"/>

    <!-- Spot share area (shrinking from ~70% to ~25%) -->
    <path d="M60,93 L90,89 L130,85 L167,76 L200,72 L244,65 L280,58 L321,52 L360,48 L398,44 L440,40 L475,38 L505,36
             L505,30 L60,30 Z" fill="#a6e3a1" fill-opacity="0.12"/>

    <!-- Labels on chart -->
    <text x="140" y="52" fill="#a6e3a1" font-family="sans-serif" font-size="9" font-weight="bold">Spot</text>
    <text x="400" y="68" fill="#89b4fa" font-family="sans-serif" font-size="9" font-weight="bold">Futures</text>

    <!-- Annotation -->
    <text x="265" y="145" fill="#585b70" font-family="sans-serif" font-size="8" text-anchor="middle">Futures now dominate 70-80% of total BTC trading volume — the derivatives tail wags the spot dog</text>
  </g>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#585b70" stroke-width="1"/>
    </marker>
    <marker id="arrowYellow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#f9e2af" stroke-width="1"/>
    </marker>
  </defs>
</svg>