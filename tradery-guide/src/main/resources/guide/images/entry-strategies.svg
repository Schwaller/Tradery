<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260">
  <rect width="560" height="260" fill="#000000" fill-opacity="0.3" rx="8"/>
  <text x="280" y="28" fill="#cdd6f4" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Entry Strategy Types</text>

  <!-- Trend Following -->
  <g transform="translate(15, 48)">
    <rect x="0" y="0" width="125" height="190" fill="#313244" fill-opacity="0.5" rx="6"/>
    <text x="62" y="20" fill="#a6e3a1" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Trend Following</text>
    <!-- Uptrend with entry on pullback -->
    <polyline points="10,150 25,140 35,130 40,135 50,125 55,130 65,115 70,120 80,105 85,110 95,95 105,85 115,75" fill="none" stroke="#585b70" stroke-width="2" stroke-linejoin="round"/>
    <!-- Entry arrow on pullback -->
    <polygon points="67,122 70,114 73,122" fill="#a6e3a1"/>
    <text x="70" y="134" fill="#a6e3a1" font-family="sans-serif" font-size="8" text-anchor="middle">Buy dip</text>
    <text x="62" y="170" fill="#585b70" font-family="sans-serif" font-size="8" text-anchor="middle">Ride the trend</text>
    <text x="62" y="182" fill="#585b70" font-family="sans-serif" font-size="8" text-anchor="middle">40-50% win rate</text>
  </g>

  <!-- Mean Reversion -->
  <g transform="translate(150, 48)">
    <rect x="0" y="0" width="125" height="190" fill="#313244" fill-opacity="0.5" rx="6"/>
    <text x="62" y="20" fill="#89b4fa" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Mean Reversion</text>
    <!-- Range with mean line -->
    <line x1="10" y1="110" x2="115" y2="110" stroke="#585b70" stroke-width="1" stroke-dasharray="3,3"/>
    <polyline points="10,110 20,95 30,85 40,100 50,120 60,135 70,140 80,125 90,105 100,90 110,100" fill="none" stroke="#585b70" stroke-width="2" stroke-linejoin="round"/>
    <!-- Buy at bottom -->
    <polygon points="67,142 70,148 73,142" fill="#a6e3a1" transform="rotate(180,70,145)"/>
    <text x="70" y="155" fill="#a6e3a1" font-family="sans-serif" font-size="8" text-anchor="middle">Buy low</text>
    <!-- Sell at top -->
    <polygon points="27,83 30,77 33,83" fill="#f38ba8" transform="rotate(180,30,80)"/>
    <text x="30" y="75" fill="#f38ba8" font-family="sans-serif" font-size="8" text-anchor="middle">Sell high</text>
    <text x="62" y="170" fill="#585b70" font-family="sans-serif" font-size="8" text-anchor="middle">Fade extremes</text>
    <text x="62" y="182" fill="#585b70" font-family="sans-serif" font-size="8" text-anchor="middle">60-70% win rate</text>
  </g>

  <!-- Momentum -->
  <g transform="translate(285, 48)">
    <rect x="0" y="0" width="125" height="190" fill="#313244" fill-opacity="0.5" rx="6"/>
    <text x="62" y="20" fill="#fab387" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Momentum</text>
    <!-- Slow start then acceleration -->
    <polyline points="10,145 20,142 30,140 40,138 50,132 55,125 60,115 65,100 70,82 75,62 80,50" fill="none" stroke="#585b70" stroke-width="2" stroke-linejoin="round"/>
    <!-- Entry at acceleration point -->
    <polygon points="52,127 55,119 58,127" fill="#a6e3a1"/>
    <text x="55" y="138" fill="#a6e3a1" font-family="sans-serif" font-size="8" text-anchor="middle">Enter</text>
    <!-- Acceleration zone -->
    <line x1="48" y1="135" x2="48" y2="45" stroke="#fab387" stroke-width="1" stroke-dasharray="2,3"/>
    <text x="75" y="45" fill="#fab387" font-family="sans-serif" font-size="8" text-anchor="middle">Accel</text>
    <text x="62" y="170" fill="#585b70" font-family="sans-serif" font-size="8" text-anchor="middle">Catch acceleration</text>
    <text x="62" y="182" fill="#585b70" font-family="sans-serif" font-size="8" text-anchor="middle">45-55% win rate</text>
  </g>

  <!-- Breakout -->
  <g transform="translate(420, 48)">
    <rect x="0" y="0" width="125" height="190" fill="#313244" fill-opacity="0.5" rx="6"/>
    <text x="62" y="20" fill="#cba6f7" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Breakout</text>
    <!-- Range then breakout -->
    <line x1="10" y1="100" x2="80" y2="100" stroke="#f38ba8" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="83" y="104" fill="#f38ba8" font-family="sans-serif" font-size="7">Resist</text>
    <polyline points="10,120 20,115 30,110 40,118 50,108 60,112 70,105 75,100 80,90 85,78 90,68 95,58 100,52" fill="none" stroke="#585b70" stroke-width="2" stroke-linejoin="round"/>
    <!-- Entry at breakout -->
    <polygon points="72,98 75,90 78,98" fill="#a6e3a1"/>
    <text x="75" y="85" fill="#a6e3a1" font-family="sans-serif" font-size="8" text-anchor="middle">Break!</text>
    <text x="62" y="170" fill="#585b70" font-family="sans-serif" font-size="8" text-anchor="middle">Break key levels</text>
    <text x="62" y="182" fill="#585b70" font-family="sans-serif" font-size="8" text-anchor="middle">35-45% win rate</text>
  </g>
</svg>
