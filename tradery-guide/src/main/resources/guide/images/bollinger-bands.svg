<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280">
  <rect width="560" height="280" fill="#000000" fill-opacity="0.3" rx="8"/>
  <text x="280" y="28" fill="#cdd6f4" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Bollinger Bands: Squeeze &amp; Expansion</text>

  <g transform="translate(40, 45)">
    <!-- Upper band -->
    <polyline
      points="0,80 30,85 60,90 90,95 100,98 110,100 120,102 130,103 140,102 150,100 160,95 170,80 190,50 210,30 230,20 250,15 270,25 290,35 310,30 330,35 350,40 370,50 390,55 410,55 430,50 450,48 470,50 490,55"
      fill="none" stroke="#89b4fa" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>

    <!-- Middle band (SMA) -->
    <polyline
      points="0,120 30,118 60,117 90,116 100,115 110,115 120,115 130,115 140,115 150,114 160,113 170,110 190,105 210,95 230,85 250,80 270,82 290,85 310,82 330,84 350,86 370,90 390,92 410,92 430,90 450,89 470,90 490,92"
      fill="none" stroke="#89b4fa" stroke-width="1.5" opacity="0.5"/>

    <!-- Lower band -->
    <polyline
      points="0,160 30,150 60,145 90,138 100,133 110,130 120,128 130,127 140,128 150,128 160,130 170,140 190,160 210,160 230,150 250,145 270,140 290,135 310,135 330,133 350,132 370,130 390,130 410,130 430,130 450,130 470,130 490,130"
      fill="none" stroke="#89b4fa" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>

    <!-- Price line -->
    <polyline
      points="0,125 30,115 60,120 90,118 100,116 110,114 120,116 130,114 140,115 150,112 160,108 170,95 190,70 210,55 230,40 250,35 270,50 290,45 310,40 330,50 350,55 370,65 390,70 410,68 430,65 450,60 470,65 490,70"
      fill="none" stroke="#cdd6f4" stroke-width="2" stroke-linejoin="round"/>

    <!-- Squeeze zone highlight -->
    <rect x="85" y="0" width="80" height="195" fill="#fab387" fill-opacity="0.06" rx="4"/>
    <text x="125" y="210" fill="#fab387" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Squeeze</text>
    <text x="125" y="222" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="middle">Low volatility</text>

    <!-- Expansion zone highlight -->
    <rect x="165" y="0" width="120" height="195" fill="#a6e3a1" fill-opacity="0.06" rx="4"/>
    <text x="225" y="210" fill="#a6e3a1" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Breakout</text>
    <text x="225" y="222" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="middle">Bands expand</text>

    <!-- Walk the band zone -->
    <rect x="285" y="0" width="120" height="195" fill="#cba6f7" fill-opacity="0.06" rx="4"/>
    <text x="345" y="210" fill="#cba6f7" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Walk the Band</text>
    <text x="345" y="222" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="middle">Strong trend</text>

    <!-- Legend -->
    <line x1="410" y1="205" x2="430" y2="205" stroke="#89b4fa" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="435" y="209" fill="#89b4fa" font-family="sans-serif" font-size="9">Upper/Lower Band</text>
    <line x1="410" y1="220" x2="430" y2="220" stroke="#cdd6f4" stroke-width="2"/>
    <text x="435" y="224" fill="#cdd6f4" font-family="sans-serif" font-size="9">Price</text>
  </g>
</svg>
