<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360">
  <rect width="560" height="360" fill="#000000" fill-opacity="0.3" rx="8"/>
  <text x="280" y="24" fill="#cdd6f4" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Critical Global Chokepoints</text>

  <!-- Legend -->
  <g transform="translate(30, 335)">
    <circle cx="0" cy="0" r="4" fill="#fab387" fill-opacity="0.6"/>
    <text x="8" y="3" fill="#7f849c" font-family="sans-serif" font-size="7">Oil/Energy</text>
    <circle cx="80" cy="0" r="4" fill="#89b4fa" fill-opacity="0.6"/>
    <text x="88" y="3" fill="#7f849c" font-family="sans-serif" font-size="7">Trade Routes</text>
    <circle cx="160" cy="0" r="4" fill="#cba6f7" fill-opacity="0.6"/>
    <text x="168" y="3" fill="#7f849c" font-family="sans-serif" font-size="7">Semiconductors</text>
  </g>

  <!-- Continental blocks -->
  <!-- Americas -->
  <rect x="20" y="55" width="130" height="220" fill="#89b4fa" fill-opacity="0.04" rx="8" stroke="#89b4fa" stroke-width="0.5" stroke-opacity="0.15"/>
  <text x="85" y="72" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="middle">Americas</text>
  <text x="55" y="120" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">US Shale</text>
  <text x="55" y="132" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">Oil &amp; Gas</text>
  <text x="55" y="195" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">Grain Belt</text>
  <text x="55" y="207" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">Corn, Soy</text>
  <text x="105" y="245" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">Chile/Arg</text>
  <text x="105" y="257" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">Lithium</text>

  <!-- Europe-ME-Africa -->
  <rect x="175" y="55" width="175" height="260" fill="#fab387" fill-opacity="0.04" rx="8" stroke="#fab387" stroke-width="0.5" stroke-opacity="0.15"/>
  <text x="262" y="72" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="middle">Europe &amp; Middle East</text>
  <text x="205" y="105" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">EU</text>
  <text x="205" y="117" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">Consumer</text>
  <text x="310" y="105" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">Russia</text>
  <text x="310" y="117" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">Gas &amp; Oil</text>
  <text x="295" y="190" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">Gulf States</text>
  <text x="295" y="202" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">~30% Oil</text>
  <text x="225" y="265" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">Ukraine — Grain</text>
  <text x="295" y="290" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">Africa — Rare Earths</text>

  <!-- Asia-Pacific -->
  <rect x="375" y="55" width="165" height="220" fill="#cba6f7" fill-opacity="0.04" rx="8" stroke="#cba6f7" stroke-width="0.5" stroke-opacity="0.15"/>
  <text x="457" y="72" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="middle">Asia-Pacific</text>
  <text x="425" y="110" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">China</text>
  <text x="425" y="122" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">Manufacturing</text>
  <text x="505" y="110" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">Japan/Korea</text>
  <text x="505" y="122" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">Tech</text>
  <text x="470" y="165" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">Taiwan</text>
  <text x="470" y="177" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">~60% Chips</text>
  <text x="440" y="235" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">Australia</text>
  <text x="440" y="247" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">Iron, LNG</text>

  <!-- Trade flow lines (dashed) -->
  <!-- Americas to Europe -->
  <line x1="150" y1="150" x2="175" y2="150" stroke="#89b4fa" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.3"/>
  <!-- Europe to Asia -->
  <line x1="350" y1="140" x2="375" y2="140" stroke="#89b4fa" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.3"/>
  <!-- Oil route: Gulf to Asia -->
  <path d="M 320,200 Q 370,220 385,170" fill="none" stroke="#fab387" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.3"/>
  <!-- Oil route: Gulf to Europe -->
  <path d="M 270,190 Q 240,160 210,140" fill="none" stroke="#fab387" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.3"/>

  <!-- Chokepoint circles -->
  <!-- 1. Strait of Hormuz -->
  <g transform="translate(330, 210)">
    <circle cx="0" cy="0" r="14" fill="#fab387" fill-opacity="0.12" stroke="#fab387" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="0" y="-2" fill="#fab387" font-family="sans-serif" font-size="6" font-weight="bold" text-anchor="middle">Hormuz</text>
    <text x="0" y="6" fill="#fab387" font-family="sans-serif" font-size="5.5" text-anchor="middle">20% oil</text>
  </g>

  <!-- 2. Suez Canal -->
  <g transform="translate(265, 230)">
    <circle cx="0" cy="0" r="14" fill="#89b4fa" fill-opacity="0.12" stroke="#89b4fa" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="0" y="-2" fill="#89b4fa" font-family="sans-serif" font-size="6" font-weight="bold" text-anchor="middle">Suez</text>
    <text x="0" y="6" fill="#89b4fa" font-family="sans-serif" font-size="5.5" text-anchor="middle">12% trade</text>
  </g>

  <!-- 3. Bab el-Mandeb -->
  <g transform="translate(290, 260)">
    <circle cx="0" cy="0" r="13" fill="#fab387" fill-opacity="0.12" stroke="#fab387" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="0" y="-2" fill="#fab387" font-family="sans-serif" font-size="5.5" font-weight="bold" text-anchor="middle">Bab el-</text>
    <text x="0" y="6" fill="#fab387" font-family="sans-serif" font-size="5.5" text-anchor="middle">Mandeb</text>
  </g>

  <!-- 4. Bosphorus -->
  <g transform="translate(275, 140)">
    <circle cx="0" cy="0" r="12" fill="#fab387" fill-opacity="0.12" stroke="#fab387" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="0" y="-2" fill="#fab387" font-family="sans-serif" font-size="5.5" font-weight="bold" text-anchor="middle">Bosphr.</text>
    <text x="0" y="6" fill="#fab387" font-family="sans-serif" font-size="5.5" text-anchor="middle">3% oil</text>
  </g>

  <!-- 5. Strait of Malacca -->
  <g transform="translate(395, 205)">
    <circle cx="0" cy="0" r="14" fill="#89b4fa" fill-opacity="0.12" stroke="#89b4fa" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="0" y="-2" fill="#89b4fa" font-family="sans-serif" font-size="6" font-weight="bold" text-anchor="middle">Malacca</text>
    <text x="0" y="6" fill="#89b4fa" font-family="sans-serif" font-size="5.5" text-anchor="middle">25% trade</text>
  </g>

  <!-- 6. Taiwan Strait -->
  <g transform="translate(445, 150)">
    <circle cx="0" cy="0" r="14" fill="#cba6f7" fill-opacity="0.12" stroke="#cba6f7" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="0" y="-2" fill="#cba6f7" font-family="sans-serif" font-size="6" font-weight="bold" text-anchor="middle">Taiwan</text>
    <text x="0" y="6" fill="#cba6f7" font-family="sans-serif" font-size="5.5" text-anchor="middle">60% chips</text>
  </g>

  <!-- 7. Panama Canal -->
  <g transform="translate(140, 215)">
    <circle cx="0" cy="0" r="13" fill="#89b4fa" fill-opacity="0.12" stroke="#89b4fa" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="0" y="-2" fill="#89b4fa" font-family="sans-serif" font-size="6" font-weight="bold" text-anchor="middle">Panama</text>
    <text x="0" y="6" fill="#89b4fa" font-family="sans-serif" font-size="5.5" text-anchor="middle">5% trade</text>
  </g>

  <!-- Bottom summary -->
  <text x="280" y="345" fill="#7f849c" font-family="sans-serif" font-size="8" text-anchor="middle">A single chokepoint disruption can cascade through global energy, trade, and financial markets within hours</text>
</svg>