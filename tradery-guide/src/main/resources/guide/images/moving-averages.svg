<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300">
  <rect width="560" height="300" fill="#000000" fill-opacity="0.3" rx="8"/>

  <text x="280" y="28" fill="#cdd6f4" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Moving Average Crossover</text>

  <!-- Price line (noisy) -->
  <polyline
    points="40,220 60,210 70,225 85,200 100,215 115,190 130,180 145,195 160,170 175,160 190,175 200,150 215,140 230,155 245,130 260,120 275,135 290,115 305,125 320,105 335,110 350,95 365,100 375,85 390,90 405,80 420,95 435,75 450,85 465,70 480,80 500,65 515,75"
    fill="none" stroke="#585b70" stroke-width="1.5" stroke-linejoin="round" opacity="0.5"/>

  <!-- Fast MA (EMA 20) -->
  <polyline
    points="40,218 70,215 100,205 130,190 160,175 190,165 220,148 250,130 280,122 310,115 340,105 370,95 400,88 430,82 460,78 490,72 515,72"
    fill="none" stroke="#fab387" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Slow MA (SMA 50) -->
  <polyline
    points="40,215 70,213 100,210 130,205 160,198 190,190 220,178 250,165 280,152 310,140 340,130 370,120 400,112 430,105 460,98 490,92 515,88"
    fill="none" stroke="#89b4fa" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Crossover point -->
  <circle cx="130" cy="193" r="8" fill="none" stroke="#a6e3a1" stroke-width="2"/>
  <text x="130" y="240" fill="#a6e3a1" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="bold">Golden Cross</text>
  <text x="130" y="254" fill="#585b70" font-family="sans-serif" font-size="10" text-anchor="middle">Fast crosses above slow</text>

  <!-- Legend -->
  <g transform="translate(350, 240)">
    <line x1="0" y1="0" x2="25" y2="0" stroke="#fab387" stroke-width="2.5"/>
    <text x="30" y="4" fill="#fab387" font-family="sans-serif" font-size="11">Fast MA (EMA 20)</text>

    <line x1="0" y1="20" x2="25" y2="20" stroke="#89b4fa" stroke-width="2.5"/>
    <text x="30" y="24" fill="#89b4fa" font-family="sans-serif" font-size="11">Slow MA (SMA 50)</text>
  </g>

  <!-- Trend arrow -->
  <g transform="translate(470, 55)">
    <polygon points="0,15 15,0 30,15" fill="#a6e3a1" opacity="0.8"/>
    <text x="15" y="30" fill="#a6e3a1" font-family="sans-serif" font-size="10" text-anchor="middle">Bullish</text>
  </g>
</svg>
