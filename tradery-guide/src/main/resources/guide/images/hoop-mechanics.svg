<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280">
  <rect width="560" height="280" fill="#000000" fill-opacity="0.3" rx="8"/>
  <text x="280" y="28" fill="#cdd6f4" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Hoop Pattern Mechanics</text>

  <g transform="translate(40, 50)">
    <!-- Timeline axis -->
    <line x1="0" y1="180" x2="480" y2="180" stroke="#585b70" stroke-width="1"/>
    <text x="240" y="198" fill="#7f849c" font-family="sans-serif" font-size="9" text-anchor="middle">Time (bars)</text>

    <!-- Price axis -->
    <line x1="0" y1="0" x2="0" y2="180" stroke="#585b70" stroke-width="1"/>

    <!-- Anchor point -->
    <circle cx="40" cy="90" r="5" fill="#cba6f7"/>
    <text x="40" y="80" fill="#cba6f7" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Anchor</text>

    <!-- Hoop 1: target zone -->
    <rect x="100" y="110" width="50" height="40" fill="#89b4fa" fill-opacity="0.1" rx="3" stroke="#89b4fa" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="125" y="168" fill="#89b4fa" font-family="sans-serif" font-size="9" text-anchor="middle">Hoop 1</text>

    <!-- Distance arrow from anchor to hoop 1 -->
    <line x1="45" y1="190" x2="120" y2="190" stroke="#585b70" stroke-width="1" marker-end="url(#arr)"/>
    <text x="82" y="206" fill="#585b70" font-family="sans-serif" font-size="8" text-anchor="middle">distance: 5</text>
    <text x="82" y="216" fill="#585b70" font-family="sans-serif" font-size="8" text-anchor="middle">tolerance: ±2</text>

    <!-- Price range labels -->
    <text x="158" y="118" fill="#89b4fa" font-family="sans-serif" font-size="8">-1%</text>
    <text x="158" y="148" fill="#89b4fa" font-family="sans-serif" font-size="8">-3%</text>

    <!-- Hoop 2: target zone -->
    <rect x="210" y="50" width="50" height="40" fill="#a6e3a1" fill-opacity="0.1" rx="3" stroke="#a6e3a1" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="235" y="168" fill="#a6e3a1" font-family="sans-serif" font-size="9" text-anchor="middle">Hoop 2</text>

    <text x="268" y="58" fill="#a6e3a1" font-family="sans-serif" font-size="8">+4%</text>
    <text x="268" y="88" fill="#a6e3a1" font-family="sans-serif" font-size="8">+1%</text>

    <!-- Hoop 3: target zone -->
    <rect x="320" y="105" width="50" height="45" fill="#fab387" fill-opacity="0.1" rx="3" stroke="#fab387" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="345" y="168" fill="#fab387" font-family="sans-serif" font-size="9" text-anchor="middle">Hoop 3</text>

    <text x="378" y="113" fill="#fab387" font-family="sans-serif" font-size="8">-0.5%</text>
    <text x="378" y="148" fill="#fab387" font-family="sans-serif" font-size="8">-3%</text>

    <!-- Trigger: breakout zone -->
    <rect x="420" y="35" width="50" height="35" fill="#f38ba8" fill-opacity="0.1" rx="3" stroke="#f38ba8" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="445" y="168" fill="#f38ba8" font-family="sans-serif" font-size="9" text-anchor="middle">Trigger</text>

    <text x="478" y="43" fill="#f38ba8" font-family="sans-serif" font-size="8">+2%↑</text>

    <!-- Price path hitting each hoop -->
    <polyline points="40,90 60,95 80,105 100,120 120,135 140,120 160,100 180,80 200,65 220,60 240,70 260,85 280,95 300,110 320,125 340,130 360,115 380,95 400,70 420,55 440,45 460,38"
      fill="none" stroke="#cdd6f4" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Hit markers -->
    <circle cx="120" cy="135" r="4" fill="none" stroke="#89b4fa" stroke-width="2"/>
    <circle cx="220" cy="60" r="4" fill="none" stroke="#a6e3a1" stroke-width="2"/>
    <circle cx="340" cy="130" r="4" fill="none" stroke="#fab387" stroke-width="2"/>
    <circle cx="440" cy="45" r="4" fill="none" stroke="#f38ba8" stroke-width="2"/>
  </g>

  <text x="280" y="268" fill="#7f849c" font-family="sans-serif" font-size="9" text-anchor="middle">Each hoop defines a price range (relative to anchor) and timing window (distance ± tolerance in bars)</text>

  <defs>
    <marker id="arr" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4" fill="none" stroke="#585b70" stroke-width="1"/>
    </marker>
  </defs>
</svg>
