<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320">
  <rect width="520" height="320" fill="#000000" fill-opacity="0.3" rx="8"/>

  <!-- Title -->
  <text x="260" y="30" fill="#cdd6f4" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Candlestick Anatomy</text>

  <!-- Bullish Candle -->
  <g transform="translate(120, 50)">
    <!-- Upper wick -->
    <line x1="40" y1="20" x2="40" y2="80" stroke="#a6e3a1" stroke-width="2"/>
    <!-- Body -->
    <rect x="20" y="80" width="40" height="120" fill="#a6e3a1" rx="2"/>
    <!-- Lower wick -->
    <line x1="40" y1="200" x2="40" y2="250" stroke="#a6e3a1" stroke-width="2"/>

    <!-- Labels -->
    <text x="90" y="25" fill="#7f849c" font-family="sans-serif" font-size="11">High</text>
    <line x1="42" y1="20" x2="85" y2="20" stroke="#7f849c" stroke-width="1" stroke-dasharray="3,3"/>

    <text x="90" y="95" fill="#a6e3a1" font-family="sans-serif" font-size="11">Close</text>
    <line x1="62" y1="80" x2="85" y2="90" stroke="#7f849c" stroke-width="1" stroke-dasharray="3,3"/>

    <text x="90" y="205" fill="#a6e3a1" font-family="sans-serif" font-size="11">Open</text>
    <line x1="62" y1="200" x2="85" y2="200" stroke="#7f849c" stroke-width="1" stroke-dasharray="3,3"/>

    <text x="90" y="255" fill="#7f849c" font-family="sans-serif" font-size="11">Low</text>
    <line x1="42" y1="250" x2="85" y2="250" stroke="#7f849c" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Wick labels -->
    <text x="-10" y="55" fill="#585b70" font-family="sans-serif" font-size="10" text-anchor="end">Upper</text>
    <text x="-10" y="67" fill="#585b70" font-family="sans-serif" font-size="10" text-anchor="end">Wick</text>

    <text x="-10" y="140" fill="#585b70" font-family="sans-serif" font-size="10" text-anchor="end">Body</text>

    <text x="-10" y="225" fill="#585b70" font-family="sans-serif" font-size="10" text-anchor="end">Lower</text>
    <text x="-10" y="237" fill="#585b70" font-family="sans-serif" font-size="10" text-anchor="end">Wick</text>

    <!-- Title -->
    <text x="40" y="278" fill="#a6e3a1" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Bullish</text>
  </g>

  <!-- Bearish Candle -->
  <g transform="translate(310, 50)">
    <!-- Upper wick -->
    <line x1="40" y1="20" x2="40" y2="80" stroke="#f38ba8" stroke-width="2"/>
    <!-- Body -->
    <rect x="20" y="80" width="40" height="120" fill="#f38ba8" rx="2"/>
    <!-- Lower wick -->
    <line x1="40" y1="200" x2="40" y2="250" stroke="#f38ba8" stroke-width="2"/>

    <!-- Labels -->
    <text x="90" y="25" fill="#7f849c" font-family="sans-serif" font-size="11">High</text>
    <line x1="42" y1="20" x2="85" y2="20" stroke="#7f849c" stroke-width="1" stroke-dasharray="3,3"/>

    <text x="90" y="95" fill="#f38ba8" font-family="sans-serif" font-size="11">Open</text>
    <line x1="62" y1="80" x2="85" y2="90" stroke="#7f849c" stroke-width="1" stroke-dasharray="3,3"/>

    <text x="90" y="205" fill="#f38ba8" font-family="sans-serif" font-size="11">Close</text>
    <line x1="62" y1="200" x2="85" y2="200" stroke="#7f849c" stroke-width="1" stroke-dasharray="3,3"/>

    <text x="90" y="255" fill="#7f849c" font-family="sans-serif" font-size="11">Low</text>
    <line x1="42" y1="250" x2="85" y2="250" stroke="#7f849c" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Wick labels -->
    <text x="-10" y="55" fill="#585b70" font-family="sans-serif" font-size="10" text-anchor="end">Upper</text>
    <text x="-10" y="67" fill="#585b70" font-family="sans-serif" font-size="10" text-anchor="end">Wick</text>

    <text x="-10" y="140" fill="#585b70" font-family="sans-serif" font-size="10" text-anchor="end">Body</text>

    <text x="-10" y="225" fill="#585b70" font-family="sans-serif" font-size="10" text-anchor="end">Lower</text>
    <text x="-10" y="237" fill="#585b70" font-family="sans-serif" font-size="10" text-anchor="end">Wick</text>

    <!-- Title -->
    <text x="40" y="278" fill="#f38ba8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Bearish</text>
  </g>
</svg>
