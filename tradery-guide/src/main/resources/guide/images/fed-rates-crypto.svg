<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280">
  <rect width="560" height="280" fill="#000000" fill-opacity="0.3" rx="8"/>
  <text x="280" y="28" fill="#cdd6f4" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Fed Funds Rate vs Bitcoin Price</text>

  <g transform="translate(50, 45)">
    <!-- Axes -->
    <line x1="0" y1="0" x2="0" y2="180" stroke="#585b70" stroke-width="1"/>
    <line x1="0" y1="180" x2="470" y2="180" stroke="#585b70" stroke-width="1"/>

    <!-- Y-axis left: Fed Rate (0-6%) -->
    <text x="-8" y="5" fill="#89b4fa" font-family="sans-serif" font-size="9" text-anchor="end">6%</text>
    <text x="-8" y="65" fill="#89b4fa" font-family="sans-serif" font-size="9" text-anchor="end">4%</text>
    <text x="-8" y="125" fill="#89b4fa" font-family="sans-serif" font-size="9" text-anchor="end">2%</text>
    <text x="-8" y="183" fill="#89b4fa" font-family="sans-serif" font-size="9" text-anchor="end">0%</text>
    <text x="-25" y="95" fill="#89b4fa" font-family="sans-serif" font-size="9" text-anchor="middle" transform="rotate(-90,-25,95)">Fed Rate</text>

    <!-- Y-axis right: BTC price (log-ish) -->
    <text x="478" y="15" fill="#cba6f7" font-family="sans-serif" font-size="9" text-anchor="start">$70K</text>
    <text x="478" y="65" fill="#cba6f7" font-family="sans-serif" font-size="9" text-anchor="start">$40K</text>
    <text x="478" y="115" fill="#cba6f7" font-family="sans-serif" font-size="9" text-anchor="start">$20K</text>
    <text x="478" y="160" fill="#cba6f7" font-family="sans-serif" font-size="9" text-anchor="start">$5K</text>
    <text x="500" y="95" fill="#cba6f7" font-family="sans-serif" font-size="9" text-anchor="middle" transform="rotate(90,500,95)">BTC Price</text>

    <!-- X-axis labels -->
    <text x="0" y="196" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="middle">2019</text>
    <text x="78" y="196" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="middle">2020</text>
    <text x="157" y="196" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="middle">2021</text>
    <text x="235" y="196" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="middle">2022</text>
    <text x="313" y="196" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="middle">2023</text>
    <text x="392" y="196" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="middle">2024</text>
    <text x="470" y="196" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="middle">2025</text>

    <!-- Grid lines -->
    <line x1="0" y1="60" x2="470" y2="60" stroke="#585b70" stroke-width="0.5" stroke-opacity="0.2"/>
    <line x1="0" y1="120" x2="470" y2="120" stroke="#585b70" stroke-width="0.5" stroke-opacity="0.2"/>

    <!-- QE zone highlight -->
    <rect x="90" y="0" width="130" height="180" fill="#a6e3a1" fill-opacity="0.04"/>
    <text x="155" y="175" fill="#a6e3a1" font-family="sans-serif" font-size="8" text-anchor="middle" opacity="0.6">QE era</text>

    <!-- QT zone highlight -->
    <rect x="235" y="0" width="120" height="180" fill="#f38ba8" fill-opacity="0.04"/>
    <text x="295" y="175" fill="#f38ba8" font-family="sans-serif" font-size="8" text-anchor="middle" opacity="0.6">QT era</text>

    <!-- Fed rate stepped line (blue) -->
    <polyline fill="none" stroke="#89b4fa" stroke-width="2"
      points="0,135 40,135 60,135 78,150 82,165 86,172 90,175 157,175 200,175 220,168 235,135 250,105 260,75 270,50 280,20 290,15 310,12 330,12 370,12 392,18 420,30 450,36 470,36"/>

    <!-- BTC price line (purple) -->
    <polyline fill="none" stroke="#cba6f7" stroke-width="2"
      points="0,145 20,150 40,148 60,155 78,142 82,160 86,145 100,130 120,115 140,85 157,50 170,40 180,55 190,65 200,30 210,12 215,35 220,48 235,55 250,70 260,95 270,105 280,118 290,130 310,120 330,110 350,100 370,95 380,75 392,12 420,10 450,30 470,15"/>

    <!-- Event callouts -->
    <!-- COVID cut -->
    <line x1="84" y1="0" x2="84" y2="180" stroke="#a6e3a1" stroke-width="0.8" stroke-dasharray="3,3" stroke-opacity="0.5"/>
    <text x="84" y="-4" fill="#a6e3a1" font-family="sans-serif" font-size="7" text-anchor="middle">COVID</text>
    <text x="84" y="-14" fill="#a6e3a1" font-family="sans-serif" font-size="7" text-anchor="middle">rate cut</text>

    <!-- Hiking cycle start -->
    <line x1="237" y1="0" x2="237" y2="180" stroke="#f38ba8" stroke-width="0.8" stroke-dasharray="3,3" stroke-opacity="0.5"/>
    <text x="237" y="-4" fill="#f38ba8" font-family="sans-serif" font-size="7" text-anchor="middle">hikes</text>
    <text x="237" y="-14" fill="#f38ba8" font-family="sans-serif" font-size="7" text-anchor="middle">begin</text>

    <!-- Rate peak -->
    <line x1="310" y1="0" x2="310" y2="180" stroke="#f9e2af" stroke-width="0.8" stroke-dasharray="3,3" stroke-opacity="0.5"/>
    <text x="310" y="-4" fill="#f9e2af" font-family="sans-serif" font-size="7" text-anchor="middle">peak</text>
    <text x="310" y="-14" fill="#f9e2af" font-family="sans-serif" font-size="7" text-anchor="middle">rate</text>

    <!-- ETF approval -->
    <line x1="388" y1="0" x2="388" y2="180" stroke="#a6e3a1" stroke-width="0.8" stroke-dasharray="3,3" stroke-opacity="0.5"/>
    <text x="388" y="-4" fill="#a6e3a1" font-family="sans-serif" font-size="7" text-anchor="middle">BTC ETF</text>
  </g>

  <!-- Legend -->
  <line x1="140" y1="262" x2="160" y2="262" stroke="#89b4fa" stroke-width="2"/>
  <text x="165" y="265" fill="#89b4fa" font-family="sans-serif" font-size="9">Fed Funds Rate</text>
  <line x1="280" y1="262" x2="300" y2="262" stroke="#cba6f7" stroke-width="2"/>
  <text x="305" y="265" fill="#cba6f7" font-family="sans-serif" font-size="9">BTC Price</text>
</svg>
