<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280">
  <rect width="560" height="280" fill="#000000" fill-opacity="0.3" rx="8"/>
  <text x="280" y="24" fill="#cdd6f4" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Strategy Class × Market Regime</text>

  <!-- Column headers -->
  <text x="260" y="52" fill="#a6e3a1" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Bull / QE</text>
  <text x="350" y="52" fill="#f38ba8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Bear / QT</text>
  <text x="440" y="52" fill="#f9e2af" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Ranging</text>
  <text x="525" y="52" fill="#fab387" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Crisis</text>

  <!-- Horizontal grid lines -->
  <line x1="20" y1="60" x2="548" y2="60" stroke="#313244" stroke-width="1"/>
  <line x1="20" y1="88" x2="548" y2="88" stroke="#313244" stroke-width="0.5"/>
  <line x1="20" y1="116" x2="548" y2="116" stroke="#313244" stroke-width="0.5"/>
  <line x1="20" y1="144" x2="548" y2="144" stroke="#313244" stroke-width="0.5"/>
  <line x1="20" y1="172" x2="548" y2="172" stroke="#313244" stroke-width="0.5"/>
  <line x1="20" y1="200" x2="548" y2="200" stroke="#313244" stroke-width="0.5"/>
  <line x1="20" y1="228" x2="548" y2="228" stroke="#313244" stroke-width="0.5"/>
  <line x1="20" y1="256" x2="548" y2="256" stroke="#313244" stroke-width="0.5"/>

  <!-- Vertical grid lines -->
  <line x1="215" y1="40" x2="215" y2="256" stroke="#313244" stroke-width="0.5"/>
  <line x1="305" y1="40" x2="305" y2="256" stroke="#313244" stroke-width="0.5"/>
  <line x1="395" y1="40" x2="395" y2="256" stroke="#313244" stroke-width="0.5"/>
  <line x1="482" y1="40" x2="482" y2="256" stroke="#313244" stroke-width="0.5"/>

  <!-- Row labels (strategy classes) -->
  <text x="118" y="78" fill="#a6e3a1" font-family="sans-serif" font-size="10" text-anchor="middle">Trend Rider</text>
  <text x="118" y="106" fill="#89b4fa" font-family="sans-serif" font-size="10" text-anchor="middle">Dip Buyer</text>
  <text x="118" y="134" fill="#74c7ec" font-family="sans-serif" font-size="10" text-anchor="middle">Range Trader</text>
  <text x="118" y="162" fill="#cba6f7" font-family="sans-serif" font-size="10" text-anchor="middle">Breakout Hunter</text>
  <text x="118" y="190" fill="#fab387" font-family="sans-serif" font-size="10" text-anchor="middle">Momentum Surfer</text>
  <text x="118" y="218" fill="#f5c2e7" font-family="sans-serif" font-size="10" text-anchor="middle">Contrarian</text>
  <text x="118" y="246" fill="#94e2d5" font-family="sans-serif" font-size="10" text-anchor="middle">Tape Reader</text>

  <!-- Green = thrives, Yellow = works with care, Red = avoid -->
  <!-- Trend Rider: Bull=green, Bear=red, Ranging=red, Crisis=red -->
  <circle cx="260" cy="74" r="7" fill="#a6e3a1" fill-opacity="0.85"/>
  <circle cx="350" cy="74" r="7" fill="#f38ba8" fill-opacity="0.85"/>
  <circle cx="440" cy="74" r="7" fill="#f38ba8" fill-opacity="0.85"/>
  <circle cx="525" cy="74" r="7" fill="#f38ba8" fill-opacity="0.85"/>

  <!-- Dip Buyer: Bull=green, Bear=red, Ranging=yellow, Crisis=yellow -->
  <circle cx="260" cy="102" r="7" fill="#a6e3a1" fill-opacity="0.85"/>
  <circle cx="350" cy="102" r="7" fill="#f38ba8" fill-opacity="0.85"/>
  <circle cx="440" cy="102" r="7" fill="#f9e2af" fill-opacity="0.85"/>
  <circle cx="525" cy="102" r="7" fill="#f9e2af" fill-opacity="0.85"/>

  <!-- Range Trader: Bull=yellow, Bear=yellow, Ranging=green, Crisis=red -->
  <circle cx="260" cy="130" r="7" fill="#f9e2af" fill-opacity="0.85"/>
  <circle cx="350" cy="130" r="7" fill="#f9e2af" fill-opacity="0.85"/>
  <circle cx="440" cy="130" r="7" fill="#a6e3a1" fill-opacity="0.85"/>
  <circle cx="525" cy="130" r="7" fill="#f38ba8" fill-opacity="0.85"/>

  <!-- Breakout Hunter: Bull=yellow, Bear=yellow, Ranging=green, Crisis=yellow -->
  <circle cx="260" cy="158" r="7" fill="#f9e2af" fill-opacity="0.85"/>
  <circle cx="350" cy="158" r="7" fill="#f9e2af" fill-opacity="0.85"/>
  <circle cx="440" cy="158" r="7" fill="#a6e3a1" fill-opacity="0.85"/>
  <circle cx="525" cy="158" r="7" fill="#f9e2af" fill-opacity="0.85"/>

  <!-- Momentum Surfer: Bull=green, Bear=yellow, Ranging=red, Crisis=yellow -->
  <circle cx="260" cy="186" r="7" fill="#a6e3a1" fill-opacity="0.85"/>
  <circle cx="350" cy="186" r="7" fill="#f9e2af" fill-opacity="0.85"/>
  <circle cx="440" cy="186" r="7" fill="#f38ba8" fill-opacity="0.85"/>
  <circle cx="525" cy="186" r="7" fill="#f9e2af" fill-opacity="0.85"/>

  <!-- Contrarian: Bull=yellow, Bear=green, Ranging=yellow, Crisis=green -->
  <circle cx="260" cy="214" r="7" fill="#f9e2af" fill-opacity="0.85"/>
  <circle cx="350" cy="214" r="7" fill="#a6e3a1" fill-opacity="0.85"/>
  <circle cx="440" cy="214" r="7" fill="#f9e2af" fill-opacity="0.85"/>
  <circle cx="525" cy="214" r="7" fill="#a6e3a1" fill-opacity="0.85"/>

  <!-- Tape Reader: Bull=green, Bear=green, Ranging=yellow, Crisis=green -->
  <circle cx="260" cy="242" r="7" fill="#a6e3a1" fill-opacity="0.85"/>
  <circle cx="350" cy="242" r="7" fill="#a6e3a1" fill-opacity="0.85"/>
  <circle cx="440" cy="242" r="7" fill="#f9e2af" fill-opacity="0.85"/>
  <circle cx="525" cy="242" r="7" fill="#a6e3a1" fill-opacity="0.85"/>

  <!-- Legend -->
  <circle cx="185" cy="270" r="5" fill="#a6e3a1" fill-opacity="0.85"/>
  <text x="195" y="273" fill="#585b70" font-family="sans-serif" font-size="9">Thrives</text>
  <circle cx="260" cy="270" r="5" fill="#f9e2af" fill-opacity="0.85"/>
  <text x="270" y="273" fill="#585b70" font-family="sans-serif" font-size="9">Works with care</text>
  <circle cx="370" cy="270" r="5" fill="#f38ba8" fill-opacity="0.85"/>
  <text x="380" y="273" fill="#585b70" font-family="sans-serif" font-size="9">Avoid</text>
</svg>