<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200">
  <rect width="560" height="200" fill="#000000" fill-opacity="0.3" rx="8"/>

  <!-- Grid lines -->
  <line x1="30" y1="40" x2="530" y2="40" stroke="#585b70" stroke-width="0.5" stroke-opacity="0.25"/>
  <line x1="30" y1="70" x2="530" y2="70" stroke="#585b70" stroke-width="0.5" stroke-opacity="0.25"/>
  <line x1="30" y1="100" x2="530" y2="100" stroke="#585b70" stroke-width="0.5" stroke-opacity="0.25"/>
  <line x1="30" y1="130" x2="530" y2="130" stroke="#585b70" stroke-width="0.5" stroke-opacity="0.25"/>
  <line x1="30" y1="160" x2="530" y2="160" stroke="#585b70" stroke-width="0.5" stroke-opacity="0.25"/>

  <!-- SMA (slow, smooth) -->
  <path d="M40,75 Q60,78 80,85 Q110,95 140,110 Q170,120 195,125 Q220,128 245,125 Q270,118 295,108 Q320,95 345,85 Q370,78 395,80 Q420,85 445,82 Q470,75 495,65 Q520,58 535,52"
        stroke="#89b4fa" stroke-width="1.5" fill="none" stroke-opacity="0.5"/>

  <!-- EMA (fast, reactive) -->
  <path d="M40,70 Q60,80 80,92 Q110,108 140,125 Q160,138 180,148 Q195,140 210,128 Q230,118 250,112 Q270,100 290,88 Q310,78 330,68 Q350,60 370,72 Q390,85 405,78 Q420,70 440,62 Q460,55 480,50 Q500,44 520,38"
        stroke="#f9e2af" stroke-width="1.5" fill="none" stroke-opacity="0.4"/>

  <!-- Phase 1: Downtrend / Selloff -->
  <line x1="45" y1="55" x2="45" y2="82" stroke="#f38ba8" stroke-width="1.2"/>
  <rect x="40" y="58" width="10" height="18" fill="#f38ba8" rx="1"/>

  <line x1="60" y1="62" x2="60" y2="95" stroke="#f38ba8" stroke-width="1.2"/>
  <rect x="55" y="68" width="10" height="20" fill="#f38ba8" rx="1"/>

  <line x1="75" y1="78" x2="75" y2="108" stroke="#f38ba8" stroke-width="1.2"/>
  <rect x="70" y="82" width="10" height="20" fill="#f38ba8" rx="1"/>

  <line x1="90" y1="88" x2="90" y2="118" stroke="#a6e3a1" stroke-width="1.2"/>
  <rect x="85" y="95" width="10" height="10" fill="#a6e3a1" rx="1"/>

  <line x1="105" y1="95" x2="105" y2="130" stroke="#f38ba8" stroke-width="1.2"/>
  <rect x="100" y="100" width="10" height="24" fill="#f38ba8" rx="1"/>

  <line x1="120" y1="108" x2="120" y2="140" stroke="#f38ba8" stroke-width="1.2"/>
  <rect x="115" y="112" width="10" height="22" fill="#f38ba8" rx="1"/>

  <!-- Phase 2: Capitulation + Hammer bottom -->
  <line x1="135" y1="118" x2="135" y2="165" stroke="#f38ba8" stroke-width="1.2"/>
  <rect x="130" y="120" width="10" height="28" fill="#f38ba8" rx="1"/>

  <!-- Hammer! Long lower wick -->
  <line x1="150" y1="130" x2="150" y2="172" stroke="#a6e3a1" stroke-width="1.2"/>
  <rect x="145" y="132" width="10" height="8" fill="#a6e3a1" rx="1"/>

  <line x1="165" y1="125" x2="165" y2="158" stroke="#a6e3a1" stroke-width="1.2"/>
  <rect x="160" y="128" width="10" height="14" fill="#a6e3a1" rx="1"/>

  <!-- Phase 3: Recovery rally -->
  <line x1="180" y1="112" x2="180" y2="142" stroke="#a6e3a1" stroke-width="1.2"/>
  <rect x="175" y="116" width="10" height="20" fill="#a6e3a1" rx="1"/>

  <line x1="195" y1="105" x2="195" y2="130" stroke="#a6e3a1" stroke-width="1.2"/>
  <rect x="190" y="108" width="10" height="16" fill="#a6e3a1" rx="1"/>

  <line x1="210" y1="98" x2="210" y2="122" stroke="#a6e3a1" stroke-width="1.2"/>
  <rect x="205" y="100" width="10" height="16" fill="#a6e3a1" rx="1"/>

  <line x1="225" y1="95" x2="225" y2="118" stroke="#f38ba8" stroke-width="1.2"/>
  <rect x="220" y="98" width="10" height="12" fill="#f38ba8" rx="1"/>

  <line x1="240" y1="88" x2="240" y2="112" stroke="#a6e3a1" stroke-width="1.2"/>
  <rect x="235" y="90" width="10" height="16" fill="#a6e3a1" rx="1"/>

  <!-- Phase 4: Consolidation / Range -->
  <line x1="255" y1="82" x2="255" y2="105" stroke="#f38ba8" stroke-width="1.2"/>
  <rect x="250" y="86" width="10" height="12" fill="#f38ba8" rx="1"/>

  <line x1="270" y1="78" x2="270" y2="100" stroke="#a6e3a1" stroke-width="1.2"/>
  <rect x="265" y="82" width="10" height="12" fill="#a6e3a1" rx="1"/>

  <line x1="285" y1="80" x2="285" y2="102" stroke="#f38ba8" stroke-width="1.2"/>
  <rect x="280" y="84" width="10" height="10" fill="#f38ba8" rx="1"/>

  <line x1="300" y1="76" x2="300" y2="98" stroke="#a6e3a1" stroke-width="1.2"/>
  <rect x="295" y="80" width="10" height="12" fill="#a6e3a1" rx="1"/>

  <line x1="315" y1="74" x2="315" y2="95" stroke="#f38ba8" stroke-width="1.2"/>
  <rect x="310" y="78" width="10" height="10" fill="#f38ba8" rx="1"/>

  <line x1="330" y1="72" x2="330" y2="92" stroke="#a6e3a1" stroke-width="1.2"/>
  <rect x="325" y="74" width="10" height="12" fill="#a6e3a1" rx="1"/>

  <!-- Phase 5: Breakout -->
  <line x1="345" y1="58" x2="345" y2="82" stroke="#a6e3a1" stroke-width="1.2"/>
  <rect x="340" y="60" width="10" height="16" fill="#a6e3a1" rx="1"/>

  <line x1="360" y1="52" x2="360" y2="75" stroke="#a6e3a1" stroke-width="1.2"/>
  <rect x="355" y="55" width="10" height="14" fill="#a6e3a1" rx="1"/>

  <!-- Phase 6: Pullback to retest -->
  <line x1="375" y1="58" x2="375" y2="82" stroke="#f38ba8" stroke-width="1.2"/>
  <rect x="370" y="62" width="10" height="14" fill="#f38ba8" rx="1"/>

  <line x1="390" y1="62" x2="390" y2="88" stroke="#f38ba8" stroke-width="1.2"/>
  <rect x="385" y="66" width="10" height="16" fill="#f38ba8" rx="1"/>

  <line x1="405" y1="58" x2="405" y2="82" stroke="#a6e3a1" stroke-width="1.2"/>
  <rect x="400" y="62" width="10" height="12" fill="#a6e3a1" rx="1"/>

  <!-- Phase 7: New trend -->
  <line x1="420" y1="52" x2="420" y2="75" stroke="#a6e3a1" stroke-width="1.2"/>
  <rect x="415" y="55" width="10" height="14" fill="#a6e3a1" rx="1"/>

  <line x1="435" y1="48" x2="435" y2="70" stroke="#f38ba8" stroke-width="1.2"/>
  <rect x="430" y="52" width="10" height="10" fill="#f38ba8" rx="1"/>

  <line x1="450" y1="42" x2="450" y2="65" stroke="#a6e3a1" stroke-width="1.2"/>
  <rect x="445" y="45" width="10" height="14" fill="#a6e3a1" rx="1"/>

  <line x1="465" y1="38" x2="465" y2="60" stroke="#a6e3a1" stroke-width="1.2"/>
  <rect x="460" y="40" width="10" height="14" fill="#a6e3a1" rx="1"/>

  <line x1="480" y1="42" x2="480" y2="58" stroke="#f38ba8" stroke-width="1.2"/>
  <rect x="475" y="44" width="10" height="8" fill="#f38ba8" rx="1"/>

  <line x1="495" y1="35" x2="495" y2="55" stroke="#a6e3a1" stroke-width="1.2"/>
  <rect x="490" y="38" width="10" height="12" fill="#a6e3a1" rx="1"/>

  <line x1="510" y1="30" x2="510" y2="52" stroke="#a6e3a1" stroke-width="1.2"/>
  <rect x="505" y="33" width="10" height="14" fill="#a6e3a1" rx="1"/>

  <!-- Entry signal at hammer bottom -->
  <circle cx="165" cy="160" r="4" fill="none" stroke="#a6e3a1" stroke-width="1.5"/>
  <line x1="165" y1="164" x2="165" y2="176" stroke="#a6e3a1" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="165" y="184" fill="#a6e3a1" font-family="sans-serif" font-size="9" text-anchor="middle">Entry</text>

  <!-- Exit signal at breakout top -->
  <circle cx="360" cy="53" r="4" fill="none" stroke="#f9e2af" stroke-width="1.5"/>
  <line x1="360" y1="42" x2="360" y2="49" stroke="#f9e2af" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="360" y="38" fill="#f9e2af" font-family="sans-serif" font-size="9" text-anchor="middle">Exit</text>

  <!-- Support zone at bottom -->
  <rect x="125" y="158" width="80" height="16" fill="#cba6f7" fill-opacity="0.08" rx="2"/>
  <line x1="125" y1="166" x2="205" y2="166" stroke="#cba6f7" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.5"/>
  <text x="128" y="180" fill="#cba6f7" font-family="sans-serif" font-size="8" opacity="0.6">Support Zone</text>

  <!-- Resistance zone -->
  <rect x="245" y="72" width="105" height="10" fill="#fab387" fill-opacity="0.08" rx="2"/>
  <line x1="245" y1="76" x2="350" y2="76" stroke="#fab387" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.4"/>
  <text x="297" y="70" fill="#fab387" font-family="sans-serif" font-size="8" text-anchor="middle" opacity="0.6">Resistance</text>

  <!-- Phase labels (subtle) -->
  <text x="90" y="178" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">Selloff</text>
  <text x="210" y="178" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">Recovery</text>
  <text x="300" y="178" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">Range</text>
  <text x="390" y="178" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">Breakout</text>
  <text x="475" y="178" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">Trend</text>

  <!-- Legend -->
  <line x1="45" y1="192" x2="62" y2="192" stroke="#89b4fa" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="66" y="195" fill="#7f849c" font-family="sans-serif" font-size="8">SMA</text>
  <line x1="95" y1="192" x2="112" y2="192" stroke="#f9e2af" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="116" y="195" fill="#7f849c" font-family="sans-serif" font-size="8">EMA</text>
</svg>
