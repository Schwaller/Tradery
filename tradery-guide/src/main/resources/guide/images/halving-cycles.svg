<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260">
  <rect width="560" height="260" fill="#000000" fill-opacity="0.3" rx="8"/>
  <text x="280" y="28" fill="#cdd6f4" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Bitcoin Halving Cycles</text>

  <g transform="translate(45, 50)">
    <!-- Y-axis (log scale representation) -->
    <line x1="0" y1="0" x2="0" y2="170" stroke="#585b70" stroke-width="1"/>
    <text x="-8" y="8" fill="#585b70" font-family="sans-serif" font-size="8" text-anchor="end">$100K</text>
    <text x="-8" y="45" fill="#585b70" font-family="sans-serif" font-size="8" text-anchor="end">$10K</text>
    <text x="-8" y="90" fill="#585b70" font-family="sans-serif" font-size="8" text-anchor="end">$1K</text>
    <text x="-8" y="130" fill="#585b70" font-family="sans-serif" font-size="8" text-anchor="end">$100</text>
    <text x="-8" y="173" fill="#585b70" font-family="sans-serif" font-size="8" text-anchor="end">$10</text>

    <!-- X-axis -->
    <line x1="0" y1="170" x2="480" y2="170" stroke="#585b70" stroke-width="1"/>

    <!-- Grid lines -->
    <line x1="0" y1="42" x2="480" y2="42" stroke="#585b70" stroke-width="0.5" stroke-opacity="0.15"/>
    <line x1="0" y1="85" x2="480" y2="85" stroke="#585b70" stroke-width="0.5" stroke-opacity="0.15"/>
    <line x1="0" y1="128" x2="480" y2="128" stroke="#585b70" stroke-width="0.5" stroke-opacity="0.15"/>

    <!-- Halving vertical lines -->
    <!-- 2012 halving -->
    <line x1="60" y1="0" x2="60" y2="170" stroke="#cba6f7" stroke-width="1.5" stroke-dasharray="4,4" stroke-opacity="0.6"/>
    <text x="60" y="185" fill="#cba6f7" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">2012</text>
    <text x="60" y="196" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">50 &gt; 25 BTC</text>

    <!-- 2016 halving -->
    <line x1="170" y1="0" x2="170" y2="170" stroke="#cba6f7" stroke-width="1.5" stroke-dasharray="4,4" stroke-opacity="0.6"/>
    <text x="170" y="185" fill="#cba6f7" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">2016</text>
    <text x="170" y="196" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">25 &gt; 12.5 BTC</text>

    <!-- 2020 halving -->
    <line x1="290" y1="0" x2="290" y2="170" stroke="#cba6f7" stroke-width="1.5" stroke-dasharray="4,4" stroke-opacity="0.6"/>
    <text x="290" y="185" fill="#cba6f7" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">2020</text>
    <text x="290" y="196" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">12.5 &gt; 6.25 BTC</text>

    <!-- 2024 halving -->
    <line x1="400" y1="0" x2="400" y2="170" stroke="#cba6f7" stroke-width="1.5" stroke-dasharray="4,4" stroke-opacity="0.6"/>
    <text x="400" y="185" fill="#cba6f7" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">2024</text>
    <text x="400" y="196" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">6.25 &gt; 3.125 BTC</text>

    <!-- BTC price curve (log scale, stylized) -->
    <polyline fill="none" stroke="#cba6f7" stroke-width="2"
      points="10,165 30,162 50,158 60,155 70,145 80,120 90,90 95,80 100,95 110,105 120,115 130,120 140,125 150,128 160,125 170,118 180,110 195,85 210,55 215,42 220,60 230,75 240,85 250,92 260,95 270,98 280,100 290,95 300,85 310,65 320,45 330,25 335,18 340,35 345,50 350,60 355,75 360,85 370,90 380,92 390,90 400,82 410,70 420,55 430,35 440,20 450,8 460,15 470,12 480,5"/>

    <!-- Cycle annotations -->
    <!-- 2012 cycle peak -->
    <circle cx="95" cy="80" r="3" fill="#a6e3a1"/>
    <text x="95" y="73" fill="#a6e3a1" font-family="sans-serif" font-size="7" text-anchor="middle">$1.1K</text>
    <text x="95" y="63" fill="#a6e3a1" font-family="sans-serif" font-size="7" text-anchor="middle">+9,000%</text>

    <!-- 2016 cycle peak -->
    <circle cx="215" cy="42" r="3" fill="#a6e3a1"/>
    <text x="215" y="35" fill="#a6e3a1" font-family="sans-serif" font-size="7" text-anchor="middle">$20K</text>
    <text x="215" y="25" fill="#a6e3a1" font-family="sans-serif" font-size="7" text-anchor="middle">+3,000%</text>

    <!-- 2020 cycle peak -->
    <circle cx="335" cy="18" r="3" fill="#a6e3a1"/>
    <text x="335" y="11" fill="#a6e3a1" font-family="sans-serif" font-size="7" text-anchor="middle">$69K</text>
    <text x="335" y="1" fill="#a6e3a1" font-family="sans-serif" font-size="7" text-anchor="middle">+700%</text>

    <!-- 2024 cycle -->
    <circle cx="450" cy="8" r="3" fill="#f9e2af"/>
    <text x="450" y="1" fill="#f9e2af" font-family="sans-serif" font-size="7" text-anchor="middle">$100K+</text>
  </g>

  <!-- Legend -->
  <line x1="145" y1="250" x2="155" y2="250" stroke="#cba6f7" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="160" y="253" fill="#cba6f7" font-family="sans-serif" font-size="9">Halving event</text>
  <circle cx="260" cy="250" r="3" fill="#a6e3a1"/>
  <text x="268" y="253" fill="#a6e3a1" font-family="sans-serif" font-size="9">Cycle peak (12-18 months after)</text>
</svg>
