<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280">
  <rect width="560" height="280" fill="#000000" fill-opacity="0.3" rx="8"/>
  <text x="280" y="28" fill="#cdd6f4" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Regulatory Milestones &amp; Crypto Price</text>

  <g transform="translate(40, 45)">
    <!-- BTC price area (background) -->
    <polyline fill="none" stroke="#cba6f7" stroke-width="1.5" stroke-opacity="0.5"
      points="0,75 12,65 24,55 36,40 48,25 55,18 62,30 70,55 85,78 100,92 115,100 130,105 145,108 160,105 175,100 190,92 205,88 215,80 230,65 245,48 260,30 272,18 278,12 282,8 286,18 292,30 300,42 310,52 320,60 330,68 340,78 348,85 355,90 362,88 370,82 378,75 386,68 394,62 402,55 412,45 422,38 432,30 442,22 452,15 462,8 472,5 480,3 490,2"/>

    <!-- Price scale (right side, subtle) -->
    <text x="498" y="10" fill="#cba6f7" font-family="sans-serif" font-size="7" opacity="0.5">$100K</text>
    <text x="498" y="50" fill="#cba6f7" font-family="sans-serif" font-size="7" opacity="0.5">$40K</text>
    <text x="498" y="90" fill="#cba6f7" font-family="sans-serif" font-size="7" opacity="0.5">$5K</text>
    <text x="498" y="110" fill="#cba6f7" font-family="sans-serif" font-size="7" opacity="0.5">$1K</text>

    <!-- Timeline axis -->
    <line x1="0" y1="120" x2="490" y2="120" stroke="#585b70" stroke-width="1.5"/>

    <!-- Year tick marks + labels -->
    <line x1="0" y1="118" x2="0" y2="122" stroke="#585b70" stroke-width="1"/>
    <text x="0" y="135" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="middle">2017</text>
    <line x1="70" y1="118" x2="70" y2="122" stroke="#585b70" stroke-width="1"/>
    <text x="70" y="135" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="middle">2018</text>
    <line x1="140" y1="118" x2="140" y2="122" stroke="#585b70" stroke-width="1"/>
    <text x="140" y="135" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="middle">2019</text>
    <line x1="210" y1="118" x2="210" y2="122" stroke="#585b70" stroke-width="1"/>
    <text x="210" y="135" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="middle">2020</text>
    <line x1="280" y1="118" x2="280" y2="122" stroke="#585b70" stroke-width="1"/>
    <text x="280" y="135" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="middle">2021</text>
    <line x1="350" y1="118" x2="350" y2="122" stroke="#585b70" stroke-width="1"/>
    <text x="350" y="135" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="middle">2022</text>
    <line x1="420" y1="118" x2="420" y2="122" stroke="#585b70" stroke-width="1"/>
    <text x="420" y="135" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="middle">2023</text>
    <line x1="490" y1="118" x2="490" y2="122" stroke="#585b70" stroke-width="1"/>
    <text x="490" y="135" fill="#585b70" font-family="sans-serif" font-size="9" text-anchor="middle">2024</text>

    <!-- === RESTRICTIVE EVENTS (red, above timeline) === -->

    <!-- China ICO ban (Sep 2017) — high stalk, large dot -->
    <line x1="28" y1="120" x2="28" y2="148" stroke="#f38ba8" stroke-width="1.2"/>
    <circle cx="28" cy="150" r="5" fill="#f38ba8"/>
    <text x="28" y="164" fill="#f38ba8" font-family="sans-serif" font-size="8" text-anchor="middle" font-weight="bold">China ICO ban</text>
    <text x="28" y="174" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">-40%</text>

    <!-- SEC ICO crackdown (early 2018) — staggered lower -->
    <line x1="80" y1="120" x2="80" y2="182" stroke="#f38ba8" stroke-width="1.2"/>
    <circle cx="80" cy="184" r="4" fill="#f38ba8"/>
    <text x="80" y="197" fill="#f38ba8" font-family="sans-serif" font-size="8" text-anchor="middle" font-weight="bold">SEC crackdown</text>
    <text x="80" y="207" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">ICO era ends</text>

    <!-- SEC sues Ripple (Dec 2020) -->
    <line x1="220" y1="120" x2="220" y2="148" stroke="#f38ba8" stroke-width="1.2"/>
    <circle cx="220" cy="150" r="4" fill="#f38ba8"/>
    <text x="220" y="164" fill="#f38ba8" font-family="sans-serif" font-size="8" text-anchor="middle" font-weight="bold">SEC sues Ripple</text>
    <text x="220" y="174" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">3-year cloud</text>

    <!-- China mining ban (May 2021) — staggered lower -->
    <line x1="295" y1="120" x2="295" y2="182" stroke="#f38ba8" stroke-width="1.2"/>
    <circle cx="295" cy="184" r="5" fill="#f38ba8"/>
    <text x="295" y="197" fill="#f38ba8" font-family="sans-serif" font-size="8" text-anchor="middle" font-weight="bold">China mining ban</text>
    <text x="295" y="207" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">-50%, hashrate exodus</text>

    <!-- SEC sues Coinbase/Binance (Jun 2023) -->
    <line x1="430" y1="120" x2="430" y2="148" stroke="#f38ba8" stroke-width="1.2"/>
    <circle cx="430" cy="150" r="4" fill="#f38ba8"/>
    <text x="430" y="164" fill="#f38ba8" font-family="sans-serif" font-size="8" text-anchor="middle" font-weight="bold">SEC sues exchanges</text>
    <text x="430" y="174" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">-8%</text>

    <!-- === CONSTRUCTIVE EVENTS (green, above timeline) === -->

    <!-- CME futures (Dec 2017) -->
    <line x1="55" y1="120" x2="55" y2="100" stroke="#a6e3a1" stroke-width="1.2"/>
    <circle cx="55" cy="98" r="4" fill="#a6e3a1"/>
    <text x="55" y="90" fill="#a6e3a1" font-family="sans-serif" font-size="8" text-anchor="middle" font-weight="bold">CME futures</text>

    <!-- El Salvador (Sep 2021) -->
    <line x1="270" y1="120" x2="270" y2="100" stroke="#a6e3a1" stroke-width="1.2"/>
    <circle cx="270" cy="98" r="4" fill="#a6e3a1"/>
    <text x="270" y="90" fill="#a6e3a1" font-family="sans-serif" font-size="8" text-anchor="middle" font-weight="bold">El Salvador adopts BTC</text>

    <!-- Ripple partial win (Jul 2023) -->
    <line x1="440" y1="120" x2="440" y2="100" stroke="#a6e3a1" stroke-width="1.2"/>
    <circle cx="440" cy="98" r="4" fill="#a6e3a1"/>
    <text x="440" y="90" fill="#a6e3a1" font-family="sans-serif" font-size="8" text-anchor="middle" font-weight="bold">Ripple wins</text>

    <!-- MiCA (Jun 2023) — staggered higher -->
    <line x1="425" y1="120" x2="425" y2="76" stroke="#a6e3a1" stroke-width="1.2"/>
    <circle cx="425" cy="74" r="3.5" fill="#a6e3a1"/>
    <text x="425" y="66" fill="#a6e3a1" font-family="sans-serif" font-size="8" text-anchor="middle" font-weight="bold">MiCA framework</text>

    <!-- BTC ETF (Jan 2024) — prominent -->
    <line x1="480" y1="120" x2="480" y2="76" stroke="#a6e3a1" stroke-width="1.2"/>
    <circle cx="480" cy="74" r="5" fill="#a6e3a1"/>
    <text x="480" y="66" fill="#a6e3a1" font-family="sans-serif" font-size="8" text-anchor="middle" font-weight="bold">BTC ETF</text>
    <text x="480" y="56" fill="#585b70" font-family="sans-serif" font-size="7" text-anchor="middle">institutional on-ramp</text>

    <!-- ETH ETF (May 2024) -->
    <line x1="492" y1="120" x2="492" y2="100" stroke="#a6e3a1" stroke-width="1.2"/>
    <circle cx="492" cy="98" r="3.5" fill="#a6e3a1"/>
    <text x="500" y="108" fill="#a6e3a1" font-family="sans-serif" font-size="7" text-anchor="start">ETH ETF</text>
  </g>

  <!-- Legend -->
  <circle cx="130" cy="265" r="4" fill="#f38ba8"/>
  <text x="139" y="268" fill="#f38ba8" font-family="sans-serif" font-size="9">Restrictive (below)</text>
  <circle cx="265" cy="265" r="4" fill="#a6e3a1"/>
  <text x="274" y="268" fill="#a6e3a1" font-family="sans-serif" font-size="9">Constructive (above)</text>
  <line x1="390" y1="265" x2="410" y2="265" stroke="#cba6f7" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="416" y="268" fill="#cba6f7" font-family="sans-serif" font-size="9" opacity="0.6">BTC Price</text>
</svg>
