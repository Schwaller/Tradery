// Shared macOS signing, notarization, and DMG creation tasks.
// Apply to modules that produce .app bundles (forge, news, desk).
//
// Usage:
//   ./gradlew :tradery-forge:packageRelease -PmacSignIdentity="Developer ID Application: ..." -PmacKeychainProfile="plaiiin-notary"
//
// Prerequisites:
//   - Xcode command line tools installed
//   - Valid Developer ID Application certificate in keychain
//   - Notarization credentials stored via: xcrun notarytool store-credentials plaiiin-notary

// These tasks expect jpackage to have already run and produced an .app bundle.
// The app name and DMG name are configured per-module via ext properties.

ext {
    // Defaults - override in each module's build.gradle before applying this script
    if (!project.hasProperty('packagingAppName')) {
        project.ext.packagingAppName = project.name
    }
    if (!project.hasProperty('packagingDmgName')) {
        project.ext.packagingDmgName = project.name
    }
}

// Sign the .app bundle - signs all binaries individually for notarization
// Note: dependsOn is set per-module (jpackage for jlink modules, jpackageApp for fatJar modules)
tasks.register('signApp') {
    group = 'packaging'
    description = 'Code sign the macOS .app bundle (all binaries)'

    doLast {
        def appPath = layout.buildDirectory.file("jpackage/${project.ext.packagingAppName}.app").get().asFile
        def entitlements = rootProject.file('packaging/entitlements.plist')
        def identity = project.findProperty('macSignIdentity') ?: 'Developer ID Application'

        if (!appPath.exists()) {
            throw new GradleException("App bundle not found: ${appPath}. Run jpackage first.")
        }

        // Extract and sign native libraries inside JARs
        def jarsWithNatives = []
        appPath.eachFileRecurse { file ->
            if (file.name.endsWith('.jar')) {
                def tempDir = new File(project.buildDir, "jar-signing/${file.name}")
                tempDir.deleteDir()
                tempDir.mkdirs()

                // Extract JAR
                project.exec { commandLine 'unzip', '-q', '-o', file.absolutePath, '-d', tempDir.absolutePath }

                // Find dylibs inside
                def hasDylibs = false
                tempDir.eachFileRecurse { inner ->
                    if (inner.name.endsWith('.dylib') || inner.name.endsWith('.jnilib')) {
                        hasDylibs = true
                        println "  Signing: ${file.name}/${inner.name}"
                        project.exec {
                            commandLine 'codesign', '--force', '--options', 'runtime', '--timestamp',
                                '--sign', identity, inner.absolutePath
                        }
                    }
                }

                // Repack JAR if we signed anything
                if (hasDylibs) {
                    file.delete()
                    project.exec {
                        workingDir tempDir
                        commandLine 'zip', '-q', '-r', file.absolutePath, '.'
                    }
                }
                tempDir.deleteDir()
            }
        }

        // Sign all dylibs and executables in the bundle
        appPath.eachFileRecurse { file ->
            if (file.name.endsWith('.dylib') || file.name.endsWith('.jnilib')) {
                println "  Signing: ${file.name}"
                project.exec {
                    commandLine 'codesign', '--force', '--options', 'runtime', '--timestamp',
                        '--sign', identity, file.absolutePath
                }
            }
        }

        // Sign executables in runtime/bin and runtime/lib
        def runtimeDir = new File(appPath, "Contents/runtime/Contents/Home")
        if (runtimeDir.exists()) {
            ['bin', 'lib'].each { subdir ->
                def dir = new File(runtimeDir, subdir)
                if (dir.exists()) {
                    dir.eachFile { file ->
                        if (file.isFile() && file.canExecute() && !file.name.endsWith('.dylib')) {
                            println "  Signing executable: ${file.name}"
                            project.exec {
                                commandLine 'codesign', '--force', '--options', 'runtime', '--timestamp',
                                    '--entitlements', entitlements.absolutePath,
                                    '--sign', identity, file.absolutePath
                            }
                        }
                    }
                }
            }
        }

        // Sign the runtime bundle (if present) before the outer app
        def runtimeBundle = new File(appPath, "Contents/runtime")
        if (runtimeBundle.exists()) {
            println "  Signing runtime bundle..."
            project.exec {
                commandLine 'codesign', '--force', '--options', 'runtime', '--timestamp',
                    '--entitlements', entitlements.absolutePath,
                    '--sign', identity,
                    runtimeBundle.absolutePath
            }
        }

        // Sign the outer .app bundle
        println "  Signing app bundle..."
        project.exec {
            commandLine 'codesign', '--force', '--options', 'runtime', '--timestamp',
                '--entitlements', entitlements.absolutePath,
                '--sign', identity,
                appPath.absolutePath
        }

        println "Signed: ${appPath}"
    }
}

// Create DMG from signed .app
tasks.register('createDmg', Exec) {
    dependsOn 'signApp'
    group = 'packaging'
    description = 'Create DMG from signed .app bundle'

    def outputDir = layout.buildDirectory.dir('jpackage').get().asFile
    def appPath = new File(outputDir, "${project.ext.packagingAppName}.app")
    def dmgPath = new File(outputDir, "${project.ext.packagingDmgName}-${project.version}.dmg")

    doFirst {
        // Remove existing DMG if present
        if (dmgPath.exists()) dmgPath.delete()
    }

    commandLine 'hdiutil', 'create',
        '-volname', project.ext.packagingDmgName,
        '-srcfolder', appPath.absolutePath,
        '-ov', '-format', 'UDZO',
        dmgPath.absolutePath

    doLast {
        println "Created DMG: ${dmgPath}"
    }
}

// Sign the DMG
tasks.register('signDmg', Exec) {
    dependsOn 'createDmg'
    group = 'packaging'
    description = 'Code sign the DMG'

    def dmgPath = layout.buildDirectory.file("jpackage/${project.ext.packagingDmgName}-${project.version}.dmg").get().asFile
    def identity = project.findProperty('macSignIdentity') ?: 'Developer ID Application'

    commandLine 'codesign', '--force', '--sign', identity, dmgPath.absolutePath

    doLast {
        println "Signed DMG: ${dmgPath}"
    }
}

// Notarize the DMG
tasks.register('notarizeDmg', Exec) {
    dependsOn 'signDmg'
    group = 'packaging'
    description = 'Submit DMG to Apple for notarization'

    def dmgPath = layout.buildDirectory.file("jpackage/${project.ext.packagingDmgName}-${project.version}.dmg").get().asFile
    def keychainProfile = project.findProperty('macKeychainProfile') ?: 'plaiiin-notary'

    commandLine 'xcrun', 'notarytool', 'submit',
        dmgPath.absolutePath,
        '--keychain-profile', keychainProfile,
        '--wait'

    doLast {
        println "Notarization complete for: ${dmgPath}"
    }
}

// Staple the notarization ticket to the DMG
tasks.register('stapleDmg', Exec) {
    dependsOn 'notarizeDmg'
    group = 'packaging'
    description = 'Staple notarization ticket to DMG'

    def dmgPath = layout.buildDirectory.file("jpackage/${project.ext.packagingDmgName}-${project.version}.dmg").get().asFile

    commandLine 'xcrun', 'stapler', 'staple', dmgPath.absolutePath

    doLast {
        println "Stapled: ${dmgPath}"
    }
}

// Full release pipeline: sign -> DMG -> sign DMG -> notarize -> staple
tasks.register('packageRelease') {
    dependsOn 'stapleDmg'
    group = 'packaging'
    description = 'Full release pipeline: sign app, create DMG, notarize, staple'

    doLast {
        def dmgPath = layout.buildDirectory.file("jpackage/${project.ext.packagingDmgName}-${project.version}.dmg").get().asFile
        println "Release package ready: ${dmgPath}"
    }
}
