// tradery-sharing: P2P entity sharing — identity, sync, discovery

plugins {
    id 'java-library'
}

dependencies {
    // Document management + entity model
    implementation project(':tradery-documents')
    implementation project(':tradery-news')

    // JSON serialization for wire protocol
    implementation "com.fasterxml.jackson.core:jackson-databind:${rootProject.ext.jacksonVersion}"

    // HTTP client for rendezvous server
    implementation "com.squareup.okhttp3:okhttp:${rootProject.ext.okhttpVersion}"

    // Logging
    implementation "org.slf4j:slf4j-api:${rootProject.ext.slf4jVersion}"

    // Test logging
    testRuntimeOnly "org.slf4j:slf4j-simple:${rootProject.ext.slf4jVersion}"
}

tasks.named('test') {
    useJUnitPlatform()
    modularity.inferModulePath = false
}
