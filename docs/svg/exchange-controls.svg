<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg" font-family="monospace" font-size="12">
  <!-- DataRangePanel -->
  <rect x="20" y="20" width="760" height="160" rx="8" fill="#1a1a2e" stroke="#4a4a6a" stroke-width="2"/>
  <text x="40" y="45" fill="#7ec8e3" font-weight="bold" font-size="14">DataRangePanel</text>
  <text x="200" y="45" fill="#666" font-size="10">(only UI for symbol/exchange selection)</text>

  <!-- Symbol combo -->
  <rect x="40" y="60" width="200" height="50" rx="4" fill="#2a2a4a" stroke="#5a5a8a"/>
  <text x="50" y="80" fill="#e0e0e0">SymbolComboBox</text>
  <text x="50" y="100" fill="#ffa500" font-size="10">symbol + exchange + marketType</text>

  <!-- Timeframe -->
  <rect x="260" y="60" width="120" height="50" rx="4" fill="#2a2a4a" stroke="#5a5a8a"/>
  <text x="270" y="80" fill="#e0e0e0">Timeframe</text>
  <text x="270" y="100" fill="#ffa500" font-size="10">1m → 1w</text>

  <!-- Duration -->
  <rect x="400" y="60" width="120" height="50" rx="4" fill="#2a2a4a" stroke="#5a5a8a"/>
  <text x="410" y="80" fill="#e0e0e0">Duration</text>
  <text x="410" y="100" fill="#ffa500" font-size="10">adaptive</text>

  <!-- Anchor date -->
  <rect x="540" y="60" width="120" height="50" rx="4" fill="#2a2a4a" stroke="#5a5a8a"/>
  <text x="550" y="80" fill="#e0e0e0">Anchor Date</text>
  <text x="550" y="100" fill="#ffa500" font-size="10">end time / "now"</text>

  <!-- Problem callout -->
  <rect x="40" y="125" width="720" height="40" rx="4" fill="#3a1a1a" stroke="#ff4444" stroke-dasharray="4"/>
  <text x="50" y="150" fill="#ff6666" font-size="11">⚠ Exchange/marketType from SymbolComboBox are IGNORED by page managers — hardcoded to binance/perp</text>
</svg>
