<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="monospace" font-size="12">
  <style>
    text { fill: #e0e0e0; }
    .label { font-size: 11px; fill: #999; }
    .title { font-size: 14px; font-weight: bold; fill: #fff; }
    .subtitle { font-size: 12px; font-weight: bold; fill: #ccc; }
    .dim { fill: #666; }
    .accent { fill: #4a9eff; }
  </style>

  <!-- Background -->
  <rect width="800" height="520" fill="#1a1a1a" rx="8"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">Chart Coordinate System — Time Bucket Model</text>

  <!-- ═══════════════ TIME BUCKET SECTION ═══════════════ -->
  <text x="40" y="65" class="subtitle">Time Bucket</text>

  <!-- Bucket boundary -->
  <line x1="80" y1="80" x2="80" y2="100" stroke="#666" stroke-width="1"/>
  <line x1="80" y1="90" x2="500" y2="90" stroke="#666" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="500" y1="80" x2="500" y2="100" stroke="#666" stroke-width="1"/>
  <text x="80" y="115" class="label">timestamp</text>
  <text x="440" y="115" class="label">timestamp + interval</text>
  <text x="290" y="85" text-anchor="middle" class="dim" font-size="10">[  candle duration, e.g. 15m = 900,000ms  ]</text>

  <!-- ═══════════════ CANDLE SECTION ═══════════════ -->
  <text x="40" y="150" class="subtitle">Candle (CandlestickRenderer)</text>

  <!-- Bucket reference lines -->
  <line x1="80" y1="160" x2="80" y2="230" stroke="#333" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="500" y1="160" x2="500" y2="230" stroke="#333" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Candle center line -->
  <line x1="80" y1="195" x2="80" y2="195" stroke="#555" stroke-width="1"/>

  <!-- Wick -->
  <line x1="80" y1="168" x2="80" y2="225" stroke="#26a65b" stroke-width="1.5"/>
  <!-- Body (centered on timestamp, max ~7px) -->
  <rect x="74" y="178" width="12" height="30" fill="#26a65b" rx="1"/>

  <!-- Center annotation -->
  <line x1="80" y1="230" x2="80" y2="240" stroke="#4a9eff" stroke-width="1"/>
  <text x="80" y="252" text-anchor="middle" class="accent" font-size="10">centered on timestamp</text>
  <text x="80" y="264" text-anchor="middle" class="dim" font-size="10">max ~7px wide</text>

  <!-- ═══════════════ FOOTPRINT SECTION ═══════════════ -->
  <text x="40" y="300" class="subtitle">Footprint Heatmap</text>

  <!-- Bucket reference lines -->
  <line x1="80" y1="310" x2="80" y2="410" stroke="#333" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="500" y1="310" x2="500" y2="410" stroke="#333" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- 10% padding left -->
  <rect x="80" y="320" width="42" height="80" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="101" y="365" text-anchor="middle" class="dim" font-size="9">10%</text>

  <!-- 80% footprint area -->
  <rect x="122" y="320" width="336" height="80" fill="#1e3a5f" stroke="#4a9eff" stroke-width="1" rx="2"/>

  <!-- Footprint buckets (price levels) -->
  <rect x="124" y="322" width="332" height="14" fill="#1a4a2e" rx="1"/>
  <rect x="124" y="338" width="332" height="14" fill="#2a6040" rx="1"/>
  <rect x="124" y="354" width="332" height="14" fill="#3a7a55" rx="1"/>
  <text x="290" y="365" text-anchor="middle" fill="#fff" font-size="9">POC</text>
  <rect x="124" y="370" width="332" height="14" fill="#2a6040" rx="1"/>
  <rect x="124" y="386" width="332" height="14" fill="#1a4a2e" rx="1"/>

  <!-- 80% label -->
  <text x="290" y="418" text-anchor="middle" class="accent" font-size="10">80% of bucket, centered</text>

  <!-- 10% padding right -->
  <rect x="458" y="320" width="42" height="80" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="479" y="365" text-anchor="middle" class="dim" font-size="9">10%</text>

  <!-- Dimension arrows for 10% -->
  <line x1="80" y1="408" x2="122" y2="408" stroke="#666" stroke-width="1"/>
  <line x1="458" y1="408" x2="500" y2="408" stroke="#666" stroke-width="1"/>

  <!-- ═══════════════ PROFILE MERGING SECTION ═══════════════ -->
  <text x="560" y="150" class="subtitle">Profile Merging</text>
  <text x="560" y="170" class="label">15m candle → 5m profiles</text>

  <!-- 15m bucket -->
  <rect x="560" y="185" width="210" height="24" fill="none" stroke="#666" stroke-width="1" rx="2"/>
  <text x="665" y="201" text-anchor="middle" class="dim" font-size="10">15m candle bucket</text>

  <!-- 3x 5m profiles -->
  <rect x="560" y="220" width="66" height="20" fill="#2a4060" stroke="#4a9eff" stroke-width="1" rx="2"/>
  <text x="593" y="234" text-anchor="middle" fill="#8ac" font-size="9">5m</text>

  <rect x="632" y="220" width="66" height="20" fill="#2a4060" stroke="#4a9eff" stroke-width="1" rx="2"/>
  <text x="665" y="234" text-anchor="middle" fill="#8ac" font-size="9">5m</text>

  <rect x="704" y="220" width="66" height="20" fill="#2a4060" stroke="#4a9eff" stroke-width="1" rx="2"/>
  <text x="737" y="234" text-anchor="middle" fill="#8ac" font-size="9">5m</text>

  <!-- Merge arrow -->
  <line x1="665" y1="248" x2="665" y2="268" stroke="#4a9eff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="665" y="285" text-anchor="middle" class="accent" font-size="10">mergeProfiles()</text>

  <!-- Merged result -->
  <rect x="590" y="295" width="150" height="20" fill="#1e3a5f" stroke="#4a9eff" stroke-width="1.5" rx="2"/>
  <text x="665" y="309" text-anchor="middle" fill="#fff" font-size="10">aggregated profile</text>

  <!-- ═══════════════ Y-AXIS SECTION ═══════════════ -->
  <text x="560" y="355" class="subtitle">Y-Axis (Price Buckets)</text>

  <!-- Price level stack -->
  <rect x="600" y="370" width="140" height="18" fill="#1a4a2e" stroke="#333" stroke-width="0.5" rx="1"/>
  <text x="750" y="383" class="dim" font-size="9">price + tick/2</text>
  <rect x="600" y="389" width="140" height="18" fill="#2a6040" stroke="#333" stroke-width="0.5" rx="1"/>
  <rect x="600" y="408" width="140" height="18" fill="#3a7a55" stroke="#333" stroke-width="0.5" rx="1"/>
  <text x="750" y="421" class="dim" font-size="9">priceLevel</text>
  <rect x="600" y="427" width="140" height="18" fill="#2a6040" stroke="#333" stroke-width="0.5" rx="1"/>
  <text x="750" y="440" class="dim" font-size="9">price - tick/2</text>
  <rect x="600" y="446" width="140" height="18" fill="#1a4a2e" stroke="#333" stroke-width="0.5" rx="1"/>

  <!-- 1px gap annotation -->
  <line x1="590" y1="388" x2="590" y2="390" stroke="#ff6b6b" stroke-width="2"/>
  <text x="575" y="393" text-anchor="end" fill="#ff6b6b" font-size="9">1px gap</text>

  <!-- Bracket for tickSize -->
  <line x1="748" y1="370" x2="755" y2="370" stroke="#999" stroke-width="0.5"/>
  <line x1="755" y1="370" x2="755" y2="445" stroke="#999" stroke-width="0.5"/>
  <line x1="748" y1="445" x2="755" y2="445" stroke="#999" stroke-width="0.5"/>
  <text x="762" y="410" class="label" font-size="9">tickSize</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#4a9eff"/>
    </marker>
  </defs>

  <!-- Legend -->
  <text x="40" y="460" class="dim" font-size="10">Candle: centered on timestamp, max ~7px body</text>
  <text x="40" y="475" class="dim" font-size="10">Footprint: 80% of time bucket, centered (10% padding each side)</text>
  <text x="40" y="490" class="dim" font-size="10">Profiles: merged via TreeMap.subMap() when profile TF &lt; chart TF</text>
  <text x="40" y="505" class="dim" font-size="10">Y buckets: [priceLevel - tickSize/2, priceLevel + tickSize/2) with 1px gap</text>
</svg>
