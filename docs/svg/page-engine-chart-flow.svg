<svg viewBox="0 0 900 750" xmlns="http://www.w3.org/2000/svg" font-family="monospace" font-size="11">
  <!-- Title -->
  <text x="350" y="25" fill="#7ec8e3" font-weight="bold" font-size="16">Page → Engine → Chart Flow</text>

  <!-- ═══════ PAGE MANAGERS (left column) ═══════ -->
  <text x="30" y="60" fill="#888" font-size="10" font-weight="bold">PAGE MANAGERS</text>

  <!-- Candles -->
  <rect x="20" y="70" width="180" height="45" rx="4" fill="#1a3a1a" stroke="#4a8a4a" stroke-width="2"/>
  <text x="30" y="90" fill="#7fff7f" font-weight="bold">CandlePageMgr</text>
  <text x="30" y="105" fill="#aaa" font-size="9">ALWAYS required</text>

  <!-- AggTrades -->
  <rect x="20" y="125" width="180" height="45" rx="4" fill="#1a2a3a" stroke="#4a6a8a" stroke-width="2"/>
  <text x="30" y="145" fill="#7fb8ff" font-weight="bold">AggTradesPageMgr</text>
  <text x="30" y="160" fill="#aaa" font-size="9">chunked, 10K/chunk</text>

  <!-- Funding -->
  <rect x="20" y="180" width="180" height="40" rx="4" fill="#2a2a3a" stroke="#5a5a7a"/>
  <text x="30" y="205" fill="#c0c0ff">FundingPageMgr</text>

  <!-- OI -->
  <rect x="20" y="230" width="180" height="40" rx="4" fill="#2a2a3a" stroke="#5a5a7a"/>
  <text x="30" y="255" fill="#c0c0ff">OIPageMgr</text>

  <!-- Premium -->
  <rect x="20" y="280" width="180" height="40" rx="4" fill="#2a2a3a" stroke="#5a5a7a"/>
  <text x="30" y="305" fill="#c0c0ff">PremiumPageMgr</text>

  <!-- FearGreed -->
  <rect x="20" y="330" width="180" height="40" rx="4" fill="#2a2a3a" stroke="#5a5a7a"/>
  <text x="30" y="355" fill="#c0c0ff">FearGreedPageMgr</text>

  <!-- Spectrum -->
  <rect x="20" y="380" width="180" height="40" rx="4" fill="#2a2a3a" stroke="#5a5a7a"/>
  <text x="30" y="405" fill="#c0c0ff">SpectrumPageMgr</text>

  <!-- ═══════ COORDINATOR (center) ═══════ -->
  <rect x="250" y="70" width="220" height="380" rx="8" fill="#1a1a2e" stroke="#6a6aaa" stroke-width="2"/>
  <text x="280" y="95" fill="#7ec8e3" font-weight="bold" font-size="13">BacktestCoordinator</text>

  <!-- Strategy tier -->
  <rect x="265" y="110" width="190" height="100" rx="4" fill="#2a1a2a" stroke="#8a4a8a"/>
  <text x="275" y="130" fill="#ff9fff" font-weight="bold" font-size="10">STRATEGY TIER (blocks)</text>
  <text x="275" y="148" fill="#ccc" font-size="9">• Candles (always)</text>
  <text x="275" y="162" fill="#ccc" font-size="9">• AggTrades (if DSL uses delta etc)</text>
  <text x="275" y="176" fill="#ccc" font-size="9">• Funding (if DSL uses FUNDING)</text>
  <text x="275" y="190" fill="#ccc" font-size="9">• OI / Premium / FearGreed</text>
  <text x="275" y="204" fill="#ccc" font-size="9">  (if DSL references them)</text>

  <!-- View tier -->
  <rect x="265" y="220" width="190" height="80" rx="4" fill="#1a2a1a" stroke="#4a8a4a"/>
  <text x="275" y="240" fill="#7fff7f" font-weight="bold" font-size="10">VIEW TIER (async)</text>
  <text x="275" y="258" fill="#ccc" font-size="9">• Whatever charts are enabled</text>
  <text x="275" y="272" fill="#ccc" font-size="9">• Doesn't block backtest</text>
  <text x="275" y="286" fill="#ccc" font-size="9">• Triggers chart refresh on ready</text>

  <!-- DataRequirements -->
  <rect x="265" y="310" width="190" height="55" rx="4" fill="#2a2a2a" stroke="#666"/>
  <text x="275" y="330" fill="#ffa500" font-weight="bold" font-size="10">DataRequirements</text>
  <text x="275" y="348" fill="#ccc" font-size="9">isReady() checks all strategy</text>
  <text x="275" y="360" fill="#ccc" font-size="9">pages loaded → trigger backtest</text>

  <!-- Arrows: pages → coordinator -->
  <line x1="200" y1="92" x2="250" y2="130" stroke="#4a8a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="147" x2="250" y2="160" stroke="#4a6a8a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="200" x2="250" y2="180" stroke="#5a5a7a" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="200" y1="250" x2="250" y2="250" stroke="#5a5a7a" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="200" y1="300" x2="250" y2="270" stroke="#5a5a7a" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="200" y1="350" x2="250" y2="280" stroke="#5a5a7a" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ═══════ INDICATOR ENGINE (center-right) ═══════ -->
  <rect x="520" y="70" width="180" height="200" rx="8" fill="#2a1a1a" stroke="#8a4a4a" stroke-width="2"/>
  <text x="535" y="95" fill="#ff8888" font-weight="bold" font-size="13">IndicatorEngine</text>
  <text x="535" y="115" fill="#ccc" font-size="9">setCandles()</text>
  <text x="535" y="130" fill="#ccc" font-size="9">setAggTrades()</text>
  <text x="535" y="145" fill="#ccc" font-size="9">setFundingRates()</text>
  <text x="535" y="160" fill="#ccc" font-size="9">setOpenInterest()</text>
  <text x="535" y="175" fill="#ccc" font-size="9">setPremiumIndex()</text>
  <text x="535" y="190" fill="#ccc" font-size="9">setFearGreedData()</text>
  <text x="535" y="210" fill="#666" font-size="9">Computes: RSI, SMA, EMA,</text>
  <text x="535" y="225" fill="#666" font-size="9">MACD, DELTA, FUNDING, etc.</text>
  <text x="535" y="245" fill="#666" font-size="9">Used by DSL ConditionEvaluator</text>
  <text x="535" y="260" fill="#666" font-size="9">+ chart indicators</text>

  <!-- Arrow: coordinator → engine -->
  <line x1="470" y1="170" x2="520" y2="170" stroke="#8a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="472" y="160" fill="#888" font-size="8">all data</text>

  <!-- ═══════ CHARTS (right column) ═══════ -->
  <text x="730" y="60" fill="#888" font-size="10" font-weight="bold">CHARTS</text>

  <!-- OverlayManager -->
  <rect x="720" y="70" width="160" height="170" rx="6" fill="#1a2a2a" stroke="#4a8a8a"/>
  <text x="730" y="90" fill="#7fffd4" font-weight="bold" font-size="11">OverlayManager</text>
  <text x="730" y="108" fill="#aaa" font-size="9">SMA/EMA</text>
  <text x="730" y="121" fill="#aaa" font-size="9">Bollinger Bands</text>
  <text x="730" y="134" fill="#aaa" font-size="9">Ichimoku</text>
  <text x="730" y="147" fill="#aaa" font-size="9">Rays</text>
  <text x="730" y="160" fill="#aaa" font-size="9">VWAP / POC</text>
  <text x="730" y="173" fill="#aaa" font-size="9">Daily Volume Profile</text>
  <text x="730" y="186" fill="#ffa500" font-size="9">Footprint Heatmap</text>
  <text x="730" y="200" fill="#666" font-size="8">  ↑ own profile page</text>
  <text x="730" y="213" fill="#666" font-size="8">  (DataServiceClient)</text>
  <text x="730" y="228" fill="#aaa" font-size="9">Source: Candles only*</text>

  <!-- IndicatorChartsManager -->
  <rect x="720" y="250" width="160" height="200" rx="6" fill="#2a1a2a" stroke="#8a4a8a"/>
  <text x="730" y="270" fill="#ff9fff" font-weight="bold" font-size="11">IndicatorCharts</text>
  <text x="730" y="290" fill="#aaa" font-size="9">RSI, ATR, ADX</text>
  <text x="730" y="303" fill="#aaa" font-size="9">MACD, Stochastic</text>
  <text x="730" y="316" fill="#aaa" font-size="9">Range Position</text>
  <text x="730" y="335" fill="#7fb8ff" font-size="9">DELTA, CVD ← AggTrades</text>
  <text x="730" y="348" fill="#7fb8ff" font-size="9">Whale, Retail ← AggTrades</text>
  <text x="730" y="367" fill="#c0c0ff" font-size="9">Funding ← FundingRates</text>
  <text x="730" y="380" fill="#c0c0ff" font-size="9">OI ← OpenInterest</text>
  <text x="730" y="393" fill="#c0c0ff" font-size="9">Premium ← PremiumIndex</text>
  <text x="730" y="406" fill="#c0c0ff" font-size="9">Fear&amp;Greed ← FearGreed</text>
  <text x="730" y="425" fill="#ffa500" font-size="9">Spectrum ← SpectrumPage</text>
  <text x="730" y="440" fill="#aaa" font-size="9">Source: IndicatorEngine</text>

  <!-- Arrows: engine → charts -->
  <line x1="700" y1="150" x2="720" y2="150" stroke="#4a8a8a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="200" x2="720" y2="340" stroke="#8a4a8a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ═══════ DATA SERVICE (bottom) ═══════ -->
  <rect x="100" y="490" width="600" height="130" rx="8" fill="#0a0a1a" stroke="#333" stroke-width="2"/>
  <text x="300" y="515" fill="#666" font-weight="bold" font-size="13">Data Service (tradery-data-service)</text>

  <rect x="120" y="530" width="130" height="40" rx="4" fill="#1a1a1a" stroke="#444"/>
  <text x="130" y="555" fill="#888" font-size="9">PageManager</text>

  <rect x="270" y="530" width="130" height="40" rx="4" fill="#1a1a1a" stroke="#444"/>
  <text x="280" y="555" fill="#888" font-size="9">AggTradesStore</text>

  <rect x="420" y="530" width="130" height="40" rx="4" fill="#1a1a1a" stroke="#444"/>
  <text x="430" y="555" fill="#888" font-size="9">SqliteDataStore</text>

  <rect x="570" y="530" width="110" height="40" rx="4" fill="#1a1a1a" stroke="#444"/>
  <text x="580" y="555" fill="#888" font-size="9">ProfileHandler</text>

  <!-- Hardcoded warning -->
  <rect x="120" y="580" width="560" height="30" rx="4" fill="#3a1a1a" stroke="#ff4444" stroke-dasharray="4"/>
  <text x="135" y="600" fill="#ff6666" font-size="10">⚠ PageHandler hardcodes "binance"/"perp" — exchange param from PageKey.exchange() is IGNORED</text>

  <!-- Arrows: page managers → data service -->
  <line x1="110" y1="420" x2="180" y2="490" stroke="#333" stroke-width="1" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <text x="90" y="460" fill="#555" font-size="8">WebSocket</text>

  <!-- Arrow defs -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#888"/>
    </marker>
  </defs>
</svg>
